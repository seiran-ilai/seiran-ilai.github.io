name: 艾奧傑亞證券交易所｜行情資料更新

on:
  schedule:
    - cron: '0,30 * * * *'   # 每 30 分鐘：整點、半點（GitHub 排程不保證準時，整點較擁擠，可能延遲數分鐘）
  workflow_dispatch:          # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ['eorzea-stock-exchange/**', '.github/workflows/aex-snapshot.yml']

permissions:
  contents: write

concurrency:
  group: aex-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 取得上一份資料（沿用成分股）
        run: |
          git fetch --depth=1 origin aex-data && git show origin/aex-data:snapshot.json > prev.json || echo '{}' > prev.json

      - name: 抓取 Universalis 並整理行情
        run: python eorzea-stock-exchange/build_snapshot.py prev.json out

      - name: 發布到 aex-data 分支（只保留最新一份，不累積歷史）
        run: |
          cd out
          git init -q -b aex-data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -qm "行情資料 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aex-data

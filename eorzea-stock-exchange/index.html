<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>艾奧傑亞證券交易所</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<meta name="description" content="把 FF14 繁中服陸行鳥 DC 的市場板做成股票看盤 App：大盤指數、類股、K 線、看盤牆、交易紀錄本。資料來源 Universalis。">
<style>
:root{
  --bg:#0a0d13;--panel:#11161f;--panel2:#161c27;--line:#222a38;--text:#d7dce5;--muted:#7c8698;
  --up:#ff4d55;--down:#22c07a;--flat:#9aa3b2;--gold:#e3b54a;--blue:#4ea1ff;
  --mono:"JetBrains Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
/* 深色細捲軸（全站） */
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:#2c3545 transparent}}  /* Firefox；Chrome/Edge 用下面的 webkit 樣式（無箭頭） */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c3545;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#45516a;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-button{display:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}.muted{color:var(--muted)}
#app{display:grid;grid-template-columns:176px 1fr;grid-template-rows:56px 32px 34px 1fr;height:100vh;min-width:1000px}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:#0d1119;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#a4721b);display:grid;place-items:center;color:#1a1204;font-family:var(--mono);font-weight:800}
.logo small{display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;font-weight:400}
.search{position:relative;flex:0 1 380px}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 32px;outline:none}
.search input:focus{border-color:var(--gold)}
.search::before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--muted);font-size:16px}
.dropdown{position:absolute;top:40px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:460px;overflow:auto;z-index:50;display:none;box-shadow:0 12px 30px #0008}
.dropdown .opt{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer}
.dropdown .opt.on,.dropdown .opt:hover{background:#222b3a}
.dropdown .opt .cat{margin-left:auto;font-size:12px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
select.scope{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:700}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.on{border-color:var(--gold);color:var(--gold)}
#ticker{grid-column:1/3;overflow:hidden;background:#0c1017;border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
#ticker .track{display:inline-block;padding-left:100%;animation:tick 160s linear infinite;line-height:34px}
#ticker:hover .track{animation-play-state:paused}
#ticker .t{display:inline-flex;gap:6px;margin-right:28px;cursor:pointer;font-size:13px}
#ticker .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;background:#0c1017;padding:0 12px;line-height:34px;color:var(--gold);font-weight:700;border-right:1px solid var(--line)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
nav{background:#0d1119;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav a{padding:8px 12px;border-radius:7px;color:var(--muted)}
nav a:hover{background:var(--panel2);color:var(--text)}
nav a.on{background:var(--panel2);color:var(--gold);font-weight:700}
nav .sep{height:1px;background:var(--line);margin:8px 4px}
nav .sub{padding-left:22px;font-size:13px}
nav .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
nav .ng{display:flex;flex-direction:column;gap:4px;border-radius:8px;transition:background .15s}
nav .ng.dragging{background:#1b2230;outline:1px dashed var(--gold);opacity:.9}
body.nav-dragging,body.nav-dragging *{cursor:grabbing!important;user-select:none}
nav a{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
nav .nreset{color:var(--gold);cursor:pointer}
nav .nedit-bar{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;font-size:12px;color:var(--gold)}nav .nedit-bar span{margin-right:auto}
nav .ng.edit{flex-direction:row;align-items:center;outline:1px dashed #3a4458}
nav .ng.edit>a:not(:first-child){display:none}nav .ng.edit>a{flex:1}
nav .nmv{display:flex;gap:2px;margin-right:4px}nav .nmv button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--text)}nav .nmv button:disabled{opacity:.3}
main{overflow:auto;padding:18px 22px 40px}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .muted{font-weight:400;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:1fr 1fr}
.g3 .name span{max-width:130px}
.compact td,.compact th{white-space:nowrap;font-size:13px;padding:4px 5px}.compact td.b{max-width:90px;overflow:hidden;text-overflow:ellipsis}.panel{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:#3a4458}
.card .t{color:var(--muted);font-size:12px}
.card .v{font-size:22px;font-weight:700}
.card.main{border-color:#4a3a14;background:linear-gradient(160deg,#1a1709,var(--panel) 60%)}
.card svg{position:absolute;right:8px;bottom:6px;opacity:.9}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;text-align:right;border-bottom:1px solid #1a2030}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
tr.row{cursor:pointer}tr.row:hover td{background:#18202d}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--text)}
.name{display:flex;align-items:center;gap:8px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.ico{width:24px;height:24px;border-radius:5px;background:#222;flex:none}
.ico.lg{width:48px;height:48px;border-radius:9px}
.hq{font-size:10px;color:var(--gold);border:1px solid #6b5520;border-radius:3px;padding:0 3px;margin-left:2px}
.star{cursor:pointer;color:#4a5263;font-size:15px;user-select:none}
.star.on{color:var(--gold)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.red{color:var(--up);border-color:#5a2226}.tag.green{color:var(--down);border-color:#1d4a35}
.rk{color:var(--muted);font-family:var(--mono);width:18px;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.item-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.item-head .p{font-size:30px;font-weight:700}
.item-head .meta{display:flex;flex-direction:column}
.chartbox{position:relative}
canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:#0b0f16ee;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:5;white-space:nowrap}
.book td{padding:3px 6px}
.book .bar{position:relative}
.book .bar i{position:absolute;top:2px;bottom:2px;right:0;opacity:.18;border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right}
.hbar{height:8px;background:#1d2431;border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--gold)}
.heat td{text-align:center;font-family:var(--mono);font-size:13px}
#overlay{position:fixed;inset:0;background:#06080cdd;display:none;place-items:center;z-index:100}
#overlay .box{width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.prog{height:8px;background:#1d2431;border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#modal{position:fixed;inset:0;background:#06080ccc;display:none;place-items:center;z-index:90}
#modal .box{width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain}
.bactions{position:sticky;bottom:-20px;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px -20px -20px;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line)}
.form{display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center}
.form input,.form select,.form textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
.form .row2{display:flex;gap:8px;align-items:center}
.brow.flash{animation:bflash .6s}@keyframes bflash{0%{background:#3a2f14}100%{background:transparent}}
.brow{display:grid;grid-template-columns:minmax(0,2fr) auto 74px 120px 130px 54px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.brow .bs{grid-column:1/-1;margin:-3px 0 2px;min-height:0}.brow .bs:empty{display:none}.brow.bhead{font-size:12px;color:var(--muted);margin-bottom:2px}
.brow input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
.brow .search input{padding-left:9px}.brow .search::before{display:none}.brow .dropdown{top:36px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 14px;cursor:pointer}
.seg button.on{background:var(--line);color:var(--text)}.seg.sm button{padding:3px 10px;font-size:12px}
.seg button.on.buy{background:#3a1519;color:var(--up)}.seg button.on.sell{background:#10301f;color:var(--down)}
.empty{color:var(--muted);text-align:center;padding:24px}
.vs{font-size:11px;margin-left:5px;color:var(--muted)}
tr.vsr-up>td{background:rgba(255,77,85,.11)}tr.vsr-down>td{background:rgba(34,192,122,.11)}
tr.vsr-up>td:first-child{box-shadow:inset 3px 0 var(--up)}tr.vsr-down>td:first-child{box-shadow:inset 3px 0 var(--down)}
.vs-key{padding:0 6px;border-radius:3px}.vs-key.up{background:rgba(255,77,85,.16)}.vs-key.down{background:rgba(34,192,122,.16)}
.note{font-size:12px;color:var(--muted)}
.wall-top{display:flex;align-items:center;gap:24px;margin-bottom:12px;padding:12px 16px;background:linear-gradient(90deg,#15120a,#0f131b);border:1px solid #3a2f14;border-radius:10px}
.wall-title{font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--gold);display:flex;align-items:center;gap:10px}
.live{font-size:11px;color:var(--up);border:1px solid #5a2226;border-radius:4px;padding:0 6px;letter-spacing:.15em;display:inline-flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.wall-stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wall-stat b{margin-right:10px}
.clock{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;line-height:1.3}.clock b{color:var(--gold);font-size:22px}
.legend .lg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #1a2030;cursor:default}
.legend .lg:hover{background:#18202d}.legend .lg.off{opacity:.4}
.legend .lg i{width:12px;height:12px;border-radius:3px;flex:none}.legend .lg .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lg b{color:var(--muted);cursor:pointer;padding:0 4px}.legend .lg b:hover{color:var(--up)}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:background .3s}
.tile:hover{border-color:#3a4458}
.tile .th{display:flex;align-items:center;gap:6px;font-size:13px}.tile .th .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .idx{width:24px;height:24px;border-radius:5px;background:#2a2410;color:var(--gold);display:grid;place-items:center;font-size:12px;flex:none}
.tile .tp{display:flex;align-items:baseline;gap:8px;margin:4px 0}.tile .big{font-size:20px;font-weight:700}
.tile .tf{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.tile.fu{animation:fu 1.6s}.tile.fd{animation:fd 1.6s}
@keyframes fu{0%{background:#5a1c22}100%{background:var(--panel)}}@keyframes fd{0%{background:#124a30}100%{background:var(--panel)}}
.lim{display:inline-block;font-size:10px;line-height:15px;padding:0 4px;border-radius:3px;margin-left:4px;color:#fff;font-weight:700;vertical-align:1px}
.lim.lu{background:var(--up)}.lim.ld{background:var(--down)}
.code{font-family:var(--mono);color:#8a93a6;font-size:12px}
td.fu,span.fu{animation:fuc 2.4s}td.fd,span.fd{animation:fdc 2.4s}
@keyframes fuc{0%{background:#8a1f2a;color:#fff}100%{background:transparent}}@keyframes fdc{0%{background:#0f6b43;color:#fff}100%{background:transparent}}
#mbar{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 14px;background:#0b0e15;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;font-size:13px}
#mbar .mb-main{display:flex;align-items:center;gap:8px}#mbar .mb-i b{margin:0 2px}
#mbar .mb-sec{display:flex;gap:14px;color:var(--muted)}#mbar .mb-sec a{display:flex;gap:5px}#mbar .mb-main .num{margin-right:2px}#mbar .mb-sec a:hover{color:var(--text)}
#mbar .mb-et{margin-left:auto;display:flex;align-items:center;gap:8px}#mbar .mb-et b{color:var(--gold);font-size:15px}
.qbig{display:flex;flex-direction:column;margin-left:20px}.qbig .p{font-size:32px;font-weight:800;line-height:1.1;padding:0 4px;border-radius:4px}
.qgrid{display:grid;grid-template-columns:repeat(4,auto);gap:2px 18px;margin-left:18px;font-size:13px}
.qgrid div{display:flex;gap:8px;justify-content:space-between}
table.quote td,table.quote th{white-space:nowrap}
.news{display:grid;grid-template-columns:96px 70px 1fr;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid #1a2030;cursor:pointer;font-size:13px}
.news2{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.news:hover{background:#18202d}
.ntag{text-align:center;font-size:11px;border-radius:3px;padding:1px 0;color:#fff;font-weight:700}
.ntag.lu{background:var(--up)}.ntag.ld{background:var(--down)}.ntag.warn{background:#b7791f}
.hm-legend{display:inline-flex;margin-left:auto}.hm-legend i{font-style:normal;font-size:11px;padding:2px 6px;color:#fff;font-family:var(--mono)}
#hm{position:relative;background:#0b0e15;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hm-g{position:absolute;border:1px solid #0b0e15;box-sizing:border-box}
.hm-gh{height:22px;line-height:22px;padding:0 6px;font-size:12px;font-weight:700;background:#151a24;cursor:pointer;overflow:hidden;white-space:nowrap}
.hm-b{position:absolute;color:#fff;overflow:hidden;cursor:pointer;padding:3px 5px;box-sizing:border-box;text-shadow:0 1px 2px #0008}
.hm-b:hover{outline:2px solid #fff;z-index:2}.hm-n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;z-index:120}

#mfoot{display:none}
/* ========== 手機版（寬度 900px 以下） ========== */
@media (max-width:900px){
  html,body{height:auto}
  body{-webkit-text-size-adjust:100%}
  #app{display:block;height:auto;min-width:0}
  /* 頁首：logo＋範圍＋重新整理一列，搜尋獨立一列 */
  header{flex-wrap:wrap;gap:8px 10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  .logo{font-size:15px;letter-spacing:.03em}.logo small{display:none}.logo .mark{width:28px;height:28px;font-size:13px}
  .search{order:3;flex:1 1 100%}
  .search input{font-size:16px;padding:9px 12px 9px 34px}
  .search::before{top:8px}
  .dropdown{max-height:60vh}.dropdown .opt{padding:9px 10px}.dropdown .opt .cat{display:none}
  .hdr-right{gap:8px}
  #refresh{font-size:0;padding:5px 11px}#refresh::after{content:"↻";font-size:17px;line-height:1}.hdr-right>.muted:first-child,#upd{display:none}
  select.scope{padding:6px 8px;font-size:14px}
  /* 大盤列、跑馬燈：可左右滑 */
  #mbar{overflow-x:auto;gap:14px;padding:7px 12px;scrollbar-width:none}#mbar::-webkit-scrollbar{display:none}
  #mbar .mb-et{margin-left:0}
  #ticker .track,#ticker .lab{line-height:30px}
  /* 側欄改成黏在上方、可左右滑的分頁列 */
  nav{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:35;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;white-space:nowrap;padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px}
  nav a.on{border-color:var(--gold)}
  nav .sub,nav .sep,nav .foot{display:none}
  nav .ng{flex:none}nav .ng.edit{outline:none;gap:2px}nav .nedit-bar{flex:none;padding:0 8px 0 2px;position:sticky;left:-10px;z-index:2;background:#0d1119;box-shadow:6px 0 8px -4px #000}nav .nedit-bar span{display:none}
  nav .nmv button{padding:3px 6px}
  main{overflow:visible;padding:12px 10px calc(40px + env(safe-area-inset-bottom))}
  /* 標題與工具列 */
  h1{font-size:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
  h1 .muted{font-size:12px!important}
  h2{flex-wrap:wrap;row-gap:8px}
  h2>span[style*="margin-left:auto"]{margin-left:0!important;width:100%;flex-wrap:wrap}
  .tabs{flex-wrap:wrap}
  /* 版面：多欄一律改單欄，指數卡片／摘要卡片兩欄 */
  .grid{grid-template-columns:minmax(0,1fr)!important;gap:10px}
  .grid.g6,.grid[style*="repeat(5"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .grid[style*="repeat(5"] .card.main{grid-column:1/-1}
  .panel{padding:12px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card{padding:10px 12px}.card .v{font-size:18px}
  /* 表格：不折行，寬的表格在面板內左右滑 */
  th,td{white-space:nowrap}
  td{padding:7px 6px}
  .name span,.name a{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g3 .name span{max-width:150px}
  /* 觸控：按鈕、輸入框加大（16px 避免 iOS 聚焦時放大畫面） */
  .btn{padding:7px 13px}.btn.sm{padding:5px 10px;font-size:13px}
  .seg button{padding:7px 13px}.seg.sm button{padding:5px 10px;font-size:13px}
  input,select,textarea{font-size:16px!important}
  /* 彈出視窗改成底部抽屜 */
  #modal{place-items:end center}
  #modal .box{width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .form{grid-template-columns:76px 1fr;gap:10px}
  .brow{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);padding:8px 0;border-bottom:1px solid var(--line)}.brow .search{grid-column:1/-1;order:0;flex:none}.brow.bhead{display:none}.brow .bt{grid-column:1/-1}
  .bactions{bottom:calc(-16px - env(safe-area-inset-bottom));margin:8px -14px calc(-16px - env(safe-area-inset-bottom));padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  #overlay .box{width:calc(100vw - 32px)}
  /* 個股頁 */
  .item-head{flex-wrap:wrap;gap:10px}
  .item-head .p{font-size:24px}
  .qbig{margin-left:0}.qbig .p{font-size:26px}
  .qgrid{grid-template-columns:repeat(2,minmax(0,1fr));margin-left:0;width:100%;gap:2px 14px}
  /* 看盤牆、新聞、熱力圖 */
  .wall-top{flex-wrap:wrap;gap:10px;padding:10px 12px}
  .wall-title{font-size:17px}
  .clock{margin-left:0;text-align:left}
  .wall-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .news{grid-template-columns:80px 44px minmax(0,1fr);gap:8px;font-size:12px}
  .news2{grid-template-columns:minmax(0,1fr)}
  .hm-legend{margin-left:0}
  #mfoot{display:block;padding:14px 14px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);line-height:1.7}
  .toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));text-align:center}
  /* 表格瘦身：手機只留重要欄位，盡量不用左右滑 */
  .hm,.name .code{display:none!important}
  .quote .opt{display:none}
  .quote[data-show="amp"] .c-amp,.quote[data-show="vr"] .c-vr,.quote[data-show="vol"] .c-vol,.quote[data-show="amt"] .c-amt,
  .quote[data-show="diff"] .c-diff,.quote[data-show="open"] .c-open,.quote[data-show="high"] .c-high,.quote[data-show="low"] .c-low,
  .quote[data-show="ref"] .c-ref,.quote[data-show="code"] .c-code,.quote[data-show="extra"] .c-extra{display:table-cell}
  .t-srv :is(th,td):is(:nth-child(4),:nth-child(n+6)){display:none}
  .t-tx :is(th,td):nth-child(5),.t-ws :is(th,td):nth-child(5){display:none}
  .t-hold :is(th,td):is(:nth-child(3),:nth-child(4),:nth-child(5),:nth-child(8)){display:none}
  .name span,.name a{max-width:9.5em}
  .quote .star{display:none}.quote{font-size:13px}.quote .name{gap:6px}.quote .name span,.quote .name a{max-width:7em}.quote td.rk{padding-right:0}.quote .lim{display:none}
  td,th{padding-left:4px;padding-right:4px}
  /* 表格裡的編輯／刪除按鈕改成圖示 */
  table :is([data-edit],[data-holdset],[data-del],[data-holddel]){font-size:0;padding:4px 9px}
  table :is([data-edit],[data-holdset])::after{content:"✎";font-size:14px}
  table :is([data-del],[data-holddel])::after{content:"✕";font-size:13px}
  /* 還是需要左右滑時，用深色細捲軸 */
  .panel::-webkit-scrollbar{height:4px}.panel::-webkit-scrollbar-thumb{background:#2a3344;border-radius:2px}.panel::-webkit-scrollbar-track{background:transparent}
}

/* ========== 請求：限流 + 快取 ========== */
const LIM={active:0,queue:[],last:0,MAXC:4,GAP:125,timer:null};
function schedule(fn){return new Promise((res,rej)=>{LIM.queue.push({fn,res,rej});pump()})}
function pump(){
  while(LIM.active<LIM.MAXC&&LIM.queue.length){
    const wait=LIM.last+LIM.GAP-Date.now();
    if(wait>0){if(!LIM.timer)LIM.timer=setTimeout(()=>{LIM.timer=null;pump()},wait);return}
    const job=LIM.queue.shift();LIM.active++;LIM.last=Date.now();
    job.fn().then(job.res,job.rej).finally(()=>{LIM.active--;pump()});
  }
}
const MEM=new Map();const INFLIGHT=new Map();
async function rawFetch(url){
  for(let i=0;i<4;i++){
    let r;try{r=await fetch(url)}catch(e){await new Promise(z=>setTimeout(z,1000*2**i));continue}
    if(r.ok)return r.json();
    if(r.status===404)return null;
    if(r.status===429||r.status>=500){await new Promise(z=>setTimeout(z,800*2**i));continue}
    throw new Error('HTTP '+r.status);
  }
  throw new Error('請求失敗（重試多次）');
}
async function getJSON(url,{ttl=TTL,persist=true}={}){
  const m=MEM.get(url);if(m&&Date.now()-m.t<ttl)return m.d;
  if(persist){const c=lsGet('aex:c:'+url);if(c&&Date.now()-c.t<ttl){MEM.set(url,c);return c.d}}
  if(INFLIGHT.has(url))return INFLIGHT.get(url);
  const p=schedule(()=>rawFetch(url)).then(d=>{
    const rec={t:Date.now(),d};if(ttl>0)MEM.set(url,rec);INFLIGHT.delete(url);
    if(persist){const s=JSON.stringify(rec);if(s.length<250000){try{localStorage.setItem('aex:c:'+url,s)}catch{pruneCache()}}}
    return d;
  },e=>{INFLIGHT.delete(url);throw e});
  INFLIGHT.set(url,p);return p;
}
function pruneCache(all){
  const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('aex:c:'))ks.push(k)}
  ks.forEach(k=>{const c=lsGet(k);if(all||!c||Date.now()-c.t>TTL)localStorage.removeItem(k)});
}

function normEntries(arr){return (arr||[]).filter(x=>!CLOSED.has(x.worldID)).map(x=>({t:x.timestamp,p:x.pricePerUnit,q:x.quantity,hq:!!x.hq,w:x.worldID,b:x.buyerName||''}))}
const EXT=3;
function cleanEntries(e){
  const out=[];let removed=0;
  for(const q of [false,true]){
    const g=e.filter(x=>x.hq===q).sort((a,b)=>a.t-b.t);
    if(g.length<5){out.push(...g);continue}
    g.forEach((x,i)=>{const win=g.slice(Math.max(0,i-10),i+11);const m=wmedian(win);
      if(m&&(x.p>m*EXT||x.p<m/EXT))removed++;else out.push(x)});
  }
  return {e:out,removed};
}
function itemsOf(d){if(!d)return {};if(d.items)return d.items;if(d.itemID!=null)return {[d.itemID]:d};return {}}

async function loadHist(ids,{within=8*DAY,store=S.hist,size=10,onProg}={}){
  const need=ids.filter(id=>!store[id]||(!store[id].snap&&Date.now()-store[id].t>TTL));
  const cs=chunk(need,size);let done=0;
  await Promise.all(cs.map(async c=>{
    try{
      const d=await getJSON(`${API}/v2/history/${enc(DC)}/${c.join(',')}?entriesToReturn=999&entriesWithin=${within}`,{persist:false});
      const its=itemsOf(d);
      c.forEach(id=>{const raw=its[id]?.entries||[];const cl=cleanEntries(normEntries(raw));store[id]={t:Date.now(),e:cl.e,removed:cl.removed,raw:raw.length}});
    }catch(e){console.warn('history',e)}
    done++;onProg&&onProg(done,cs.length);
  }));
  S.memo.clear();
}

async function scanConstituents(){
  const ids=ITEMS.filter(it=>it.sec).map(it=>it.id);
  const cs=chunk(ids,100);let done=0;const score={};

/* ========== 計算 ========== */
function wmedian(es){
  if(!es.length)return null;
  const a=[...es].sort((x,y)=>x.p-y.p);let tot=0;a.forEach(x=>tot+=x.q);
  let c=0;for(const x of a){c+=x.q;if(c>=tot/2)return x.p}
  return a[a.length-1].p;
}
function mainQ(id){
  if(S.qual[id]!=null)return S.qual[id];
  const it=ITEM[id];if(!it?.canHq)return false;
  const e=(S.hist30[id]||S.hist[id])?.e||[];
  let h=0,n=0;e.forEach(x=>x.hq?h+=x.q:n+=x.q);
  return h>n;
}
function statsOf(e,q,world){
  const now=nowS();
  const es=e.filter(x=>x.hq===q&&(!world||x.w===world));
  const today=es.filter(x=>x.t>=now-DAY),prev=es.filter(x=>x.t<now-DAY&&x.t>=now-8*DAY);
  const pT=wmedian(today),pP=wmedian(prev);
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  // 999 筆上限：若資料被截斷，前 7 日只涵蓋部分天數，改用實際涵蓋天數換算日均
  let cov=7;
  if(e.length>=999||e._cap){let old=Infinity;for(const x of e)if(x.t<old)old=x.t;cov=Math.max(0,Math.min(7,(now-DAY-old)/DAY))}
  const prevVol=sum(prev,x=>x.q),prevAmt=sum(prev,x=>x.q*x.p);
  const td=[...today].sort((a,b)=>a.t-b.t);const tp=td.map(x=>x.p),pp=prev.map(x=>x.p);
  const open=td.length?td[0].p:null,high=tp.length?Math.max(...tp):null,low=tp.length?Math.min(...tp):null;
  const prevHigh=pp.length?Math.max(...pp):null,prevLow=pp.length?Math.min(...pp):null;
  const dVol0=cov>=0.5?prevVol/cov:null;
  return {pT,pP,price:pT??pP,chg:(pT!=null&&pP!=null)?(pT/pP-1)*100:null,cov,truncated:cov<7,
    open,high,low,prevHigh,prevLow,diff:(pT!=null&&pP!=null)?pT-pP:null,amp:(high!=null&&pP)?(high-low)/pP*100:null,
    vr:dVol0>0?td.reduce((a,x)=>a+x.q,0)/dVol0:null,
    vol:sum(today,x=>x.q),amt:sum(today,x=>x.q*x.p),prevVol,prevAmt,
    dVol:cov>=0.5?prevVol/cov:null,dAmt:cov>=0.5?prevAmt/cov:null,es,today,prev};
}
function stats(id,world=S.scope){
  const k=id+'|'+world;if(S.memo.has(k))return S.memo.get(k);
  const h=S.hist[id];const s=statsOf(h?(h.raw>=999?Object.assign(h.e,{_cap:true}):h.e):[],mainQ(id),world);S.memo.set(k,s);return s;
}
function indexOf(ids,world=S.scope){
  let num=0,den=0,n=0;
  ids.forEach(id=>{const s=stats(id,world);if(s.pT!=null&&s.pP!=null&&s.dAmt>0){num+=s.dAmt*s.pT/s.pP;den+=s.dAmt;n++}});
  return den?{v:1000*num/den,chg:(num/den-1)*100,n}:{v:null,chg:null,n:0};
}
function indexSeries(ids,world=S.scope){
  const now=nowS();const pts=[];const base={},w={},last={};
  ids.forEach(id=>{const s=stats(id,world);if(s.pP!=null&&s.dAmt>0){base[id]=s.pP;w[id]=s.dAmt;last[id]=s.pP}});
  const keys=Object.keys(base);if(!keys.length)return [];
  for(let k=7;k>=0;k--){
    const a=now-(k+1)*DAY,b=now-k*DAY;let num=0,den=0;
    keys.forEach(id=>{const es=stats(id,world).es.filter(x=>x.t>=a&&x.t<b);const p=wmedian(es);if(p!=null)last[id]=p;num+=w[id]*last[id]/base[id];den+=w[id]});
    pts.push({label:k===0?'今日':`-${k}日`,v:1000*num/den});
  }
  return pts;
}

/* ========== 圖表 ========== */
function sparkline(pts,w=110,h=34){
  if(pts.length<2)return '';
  const vs=pts.map(p=>p.v);const mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(p.v-mn)/r*(h-4)).toFixed(1)}`).join('');
  const c=vs[vs.length-1]>=vs[0]?'var(--up)':'var(--down)';
  return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
}
function setupCanvas(cv){const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return {g,W,H}}
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawLine(cv,pts){
  const {g,W,H}=setupCanvas(cv);g.clearRect(0,0,W,H);
  if(pts.length<2){g.fillStyle=CSSV('--muted');g.fillText('資料不足',W/2-24,H/2);return}
  const padL=10,padR=64,padT=12,padB=24;const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs,1000),mx=Math.max(...vs,1000);const r=(mx-mn)||1;mn-=r*.1;mx+=r*.1;
  const x=i=>padL+i/(pts.length-1)*(W-padL-padR),y=v=>padT+(mx-v)/(mx-mn)*(H-padT-padB);
  g.font='11px '+CSSV('--mono');g.strokeStyle='#1d2431';g.fillStyle=CSSV('--muted');
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g.beginPath();g.moveTo(padL,y(v));g.lineTo(W-padR,y(v));g.stroke();g.fillText(fmt(v,1),W-padR+6,y(v)+4)}
  g.setLineDash([4,4]);g.strokeStyle='#5a6070';g.beginPath();g.moveTo(padL,y(1000));g.lineTo(W-padR,y(1000));g.stroke();g.setLineDash([]);
  const up=vs[vs.length-1]>=1000;const col=up?CSSV('--up'):CSSV('--down');

function buildCandles(es,mode,days=30){
  const now=nowS();const out=[];
  let n,start,step;
  if(mode==='hour'){step=3600;n=72;start=Math.floor(now/3600)*3600-(n-1)*3600}
  else{

    const d=new Date();d.setHours(0,0,0,0);if(mode==='week')d.setDate(d.getDate()-((d.getDay()+6)%7));
    step=mode==='week'?7*DAY:DAY;const last=d.getTime()/1000;n=mode==='week'?53:days;start=last-(n-1)*step;
    const first=es.length?Math.min(...es.map(x=>x.t)):now;const fs=Math.max(start,Math.floor((first-last)/step)*step+last);n=Math.round((last-fs)/step)+1;start=fs}
  const a=[...es].sort((x,y)=>x.t-y.t);let prevC=null,j=0;
  for(let i=0;i<n;i++){
    const t0=start+i*step,t1=t0+step;const b=[];while(j<a.length&&a[j].t<t1){if(a[j].t>=t0)b.push(a[j]);j++}
    const lab=mode==='hour'?tstr(t0,false):(()=>{const d=new Date(t0*1000);return (mode==='week'&&d.getMonth()===0&&d.getDate()<=7?d.getFullYear()+'/':'')+`${d.getMonth()+1}/${d.getDate()}`})();
    if(b.length){const ps=b.map(x=>x.p);const c={t:t0,lab,o:b[0].p,c:b[b.length-1].p,h:Math.max(...ps),l:Math.min(...ps),v:b.reduce((s,x)=>s+x.q,0),n:b.length};out.push(c);prevC=c.c}
    else out.push(prevC==null?{t:t0,lab,empty:true,none:true}:{t:t0,lab,o:prevC,c:prevC,h:prevC,l:prevC,v:0,empty:true});
  }

}

function calcInd(cs){

  const put=a=>{const o=A();a.forEach((v,k)=>o[idx[k]]=v);return o};
  const sma=p=>C.map((_,k)=>k<p-1?null:C.slice(k-p+1,k+1).reduce((a,b)=>a+b,0)/p);

  let K=50,D=50;const Ks=[],Ds=[];

    const rsv=hi===lo?50:(c-lo)/(hi-lo)*100;K=K*2/3+rsv/3;D=D*2/3+K/3;Ks.push(K);Ds.push(D)});
  let ag=0,al=0;const R=[];
  C.forEach((c,k)=>{if(!k){R.push(null);return}const d=c-C[k-1],gn=Math.max(d,0),ls=Math.max(-d,0);

function buildTick(es,ref){

  const a=es.filter(x=>x.t>=start).sort((x,y)=>x.t-y.t);
  const pts=[];let j=0,last=null,cq=0,ca=0;
  for(let i=0;i<n;i++){const t0=start+i*step,t1=t0+step;let v=0,amt=0,has=false;
    while(j<a.length&&a[j].t<t1){last=a[j].p;v+=a[j].q;amt+=a[j].p*a[j].q;has=true;j++}
    cq+=v;ca+=amt;pts.push({t:t0,p:last,v,has,avg:cq?ca/cq:null})}
  const first=a[0]?.p;return {pts,ref:ref??first??null};
}

  const ref=T.ref;const padL=62,padR=62,padT=12,labH=20,gap=10;const volH=Math.round(H*.2);const priceH=H-padT-labH-volH-gap;

const RANKS=[['gain','漲幅'],['loss','跌幅'],['amp','振幅'],['vr','量比（爆量）'],['vol','成交量'],['amt','成交額'],['high','創 8 日新高'],['low','創 8 日新低'],['limup','漲停'],['limdn','跌停']];
function rankIds(k){
  const all=allCons().map(id=>({id,s:stats(id)})).filter(r=>r.s.price!=null);
  const act=r=>r.s.today.length>=2&&r.s.prev.length>=3;
  const by=(f,flt=()=>true)=>all.filter(flt).sort(f).map(r=>r.id);
  switch(k){
    case 'gain':return by((a,b)=>b.s.chg-a.s.chg,r=>act(r)&&r.s.chg>0);
    case 'loss':return by((a,b)=>a.s.chg-b.s.chg,r=>act(r)&&r.s.chg<0);
    case 'amp':return by((a,b)=>b.s.amp-a.s.amp,r=>r.s.amp!=null&&r.s.today.length>=3);
    case 'vr':return by((a,b)=>b.s.vr-a.s.vr,r=>r.s.vr!=null&&r.s.today.length>=3);
    case 'vol':return by((a,b)=>b.s.vol-a.s.vol,r=>r.s.vol>0);
    case 'amt':return by((a,b)=>b.s.amt-a.s.amt,r=>r.s.amt>0);
    case 'high':return by((a,b)=>b.s.high/b.s.prevHigh-a.s.high/a.s.prevHigh,r=>act(r)&&r.s.high>r.s.prevHigh);
    case 'low':return by((a,b)=>a.s.low/a.s.prevLow-b.s.low/b.s.prevLow,r=>act(r)&&r.s.low<r.s.prevLow);
    case 'limup':return by((a,b)=>b.s.chg-a.s.chg,r=>act(r)&&isLimUp(r.s.chg));
    case 'limdn':return by((a,b)=>a.s.chg-b.s.chg,r=>act(r)&&isLimDn(r.s.chg));
  }
  return [];
}

function genNews(){
  const out=[];if(!S.cons)return out;
  allCons().forEach(id=>{const s=stats(id);if(s.price==null)return;const n=ITEM[id].n;const tt=s.today.length?Math.max(...s.today.map(x=>x.t)):(S.updated||Date.now())/1000;
    const push=(p,tag,c,text)=>out.push({p,t:tt,id,tag,c,text});
    const act=s.today.length>=3&&s.prev.length>=3;
    if(act&&isLimUp(s.chg))push(3,'漲停','lu',`${n} 上漲 ${fmt(s.chg,1)}%，成交價 ${fmt(s.price)}（參考價 ${fmt(s.pP)}）`);
    if(act&&isLimDn(s.chg))push(3,'跌停','ld',`${n} 下跌 ${fmt(-s.chg,1)}%，成交價 ${fmt(s.price)}（參考價 ${fmt(s.pP)}）`);
    if(s.vr!=null&&s.vr>=3&&s.today.length>=5)push(2,'爆量','warn',`${n} 今日成交 ${fmt(s.vol)}，是前 7 日均量的 ${fmt(s.vr,1)} 倍`);
    if(act&&s.high>s.prevHigh)push(1,'新高','lu',`${n} 今日最高 ${fmt(s.high)}，創 8 日新高`);
    if(act&&s.low<s.prevLow)push(1,'新低','ld',`${n} 今日最低 ${fmt(s.low)}，創 8 日新低`);
    if(s.today.length>=5){const bm={};let tot=0;s.today.forEach(x=>{bm[x.b]=(bm[x.b]||0)+x.q;tot+=x.q});const top=Math.max(...Object.values(bm));
      if(tot&&top/tot>=.5)push(1,'籌碼集中','warn',`${n} 今日單一買家買下 ${fmt(top/tot*100,0)}% 的成交量`)}
  });
  SECTORS.forEach(sec=>{const ix=indexOf(S.cons.sectors[sec.key]);if(ix.chg!=null&&Math.abs(ix.chg)>=5)out.push({p:2,t:(S.updated||Date.now())/1000,sec:sec.key,tag:'類股',c:ix.chg>0?'lu':'ld',text:`${sec.name}指數${ix.chg>0?'上漲':'下跌'} ${fmt(Math.abs(ix.chg),2)}%，報 ${fmt(ix.v,2)} 點`})});
  return out.sort((a,b)=>b.t-a.t||b.p-a.p);
}

function squarify(nodes,rect){
  const res=[];const tot=nodes.reduce((s,n)=>s+n.v,0);if(!tot)return res;
  const area=rect.w*rect.h;const items=nodes.map(n=>({n,a:n.v/tot*area}));let r={...rect},row=[];
  const worst=(rw,len)=>{const s=rw.reduce((a,b)=>a+b.a,0);let mx=0,mn=Infinity;rw.forEach(x=>{mx=Math.max(mx,x.a);mn=Math.min(mn,x.a)});return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn))};
  const lay=rw=>{const s=rw.reduce((a,b)=>a+b.a,0);
    if(r.w>=r.h){const cw=s/r.h;let y=r.y;rw.forEach(it=>{const h=it.a/cw;res.push({n:it.n,x:r.x,y,w:cw,h});y+=h});r={x:r.x+cw,y:r.y,w:r.w-cw,h:r.h}}
    else{const rh=s/r.w;let x=r.x;rw.forEach(it=>{const w=it.a/rh;res.push({n:it.n,x,y:r.y,w,h:rh});x+=w});r={x:r.x,y:r.y+rh,w:r.w,h:r.h-rh}}};
  for(const it of items){const len=Math.min(r.w,r.h);if(!row.length||worst([...row,it],len)<=worst(row,len))row.push(it);else{lay(row);row=[it]}}
  if(row.length)lay(row);return res;
}
function hmColor(c){if(c==null||Math.abs(c)<0.005)return '#2b303b';const a=Math.min(1,Math.abs(c)/LIMIT);const base=c>0?[214,48,58]:[22,150,92],g=[43,48,59];
  return `rgb(${g.map((v,i)=>Math.round(v+(base[i]-v)*(.3+.7*a))).join(',')})`}

    squarify(G.items,{x:gr.x+2,y:gr.y+22,w:gr.w-4,h:gr.h-24}).forEach(b=>{const it=b.n;const c=it.st.chg;const big=b.w>70&&b.h>40,mid=b.w>44&&b.h>24;
      html+=`<div class="hm-b" data-go="#/item/${it.id}" title="${esc(ITEM[it.id].n)}　${fmt(it.st.price)}　${c!=null?(c>0?'+':'')+fmt(c,2)+'%':'—'}　成交額 ${fmtBig(it.st.amt)}" style="left:${b.x}px;top:${b.y}px;width:${b.w-2}px;height:${b.h-2}px;background:${hmColor(c)}">
        ${mid?`<div class="hm-n" style="font-size:${big?13:11}px">${esc(ITEM[it.id].n)}</div>`:''}${big?`<div class="num" style="font-size:12px">${c!=null?(c>0?'+':'')+fmt(c,2)+'%':'—'}</div><div class="num" style="font-size:11px;opacity:.75">${fmt(it.st.price)}</div>`:''}</div>`});

function spreadRows(){
  const out=[];
  allCons().forEach(id=>{
    const q=mainQ(id);const e=(S.hist[id]?.e||[]).filter(x=>x.hq===q);const per={};
    e.forEach(x=>(per[x.w]=per[x.w]||[]).push(x));
    const dcMed=wmedian(e);if(!dcMed)return;
    // 排除亂掛價：各服 7 日股價須落在 DC 股價的 1/4～4 倍內
    const ps=Object.entries(per).filter(([w,a])=>a.length>=5).map(([w,a])=>({w:+w,p:wmedian(a)})).filter(x=>x.p>=dcMed/4&&x.p<=dcMed*4);
    if(ps.length<2)return;ps.sort((a,b)=>a.p-b.p);const lo=ps[0],hi=ps[ps.length-1];
    out.push({id,lo,hi,sp:(hi.p/lo.p-1)*100});
  });
  return out.sort((a,b)=>b.sp-a.sp).slice(0,10);
}

function worldAgg(world){let vol=0,amt=0,pamt=0;const buyers=new Set();
  allCons().forEach(id=>{const s=stats(id,world);if(s.dAmt==null)return;vol+=s.vol;amt+=s.amt;pamt+=s.dAmt*7;s.today.forEach(x=>x.b&&buyers.add(x.b))});
  return {vol,amt,pamt,buyers:buyers.size}}
function serverMini(){
  const rows=WORLDS.map(([id,n])=>({id,n,a:worldAgg(id)}));const mx=Math.max(1,...rows.map(r=>r.a.amt));
  return `<div class="panel"><h2>各伺服器成交額<span class="muted">近 24 小時・成分股</span></h2><table>${rows.sort((a,b)=>b.a.amt-a.a.amt).map(r=>`<tr class="row" data-go="#/servers"><td style="width:80px">${r.n}</td><td><div class="hbar"><i style="width:${r.a.amt/mx*100}%"></i></div></td><td class="num" style="width:90px">${fmtBig(r.a.amt)}</td></tr>`).join('')}</table></div>`;
}

async function loadLong(id,days){

const WALL_COLORS=['#f0b429','#22d3ee','#e879f9','#a3e635','#fb923c','#a78bfa','#f1f5f9','#f472b6','#60a5fa','#2dd4bf'];
const WALL_MAX=10;
const WALL_RANGES={day:{label:'24 小時',step:3600,n:24,fmt:t=>tstr(t,false)},week:{label:'7 日',step:6*3600,n:28,fmt:t=>tstr(t)},month:{label:'30 日',step:DAY,n:30,fmt:t=>{const d=new Date(t*1000);return `${d.getMonth()+1}/${d.getDate()}`}}};
S.wall=lsGet('aex_wall',null)||['s:all',...SECTORS.map(s=>'s:'+s.key)];
S.wallRange=lsGet('aex_wallrange','week');

function saveWall(){lsSet('aex_wall',S.wall)}
function wallLabel(tok){const [k,v]=tok.split(':');if(k==='s')return v==='all'?'大盤指數':(v.startsWith('c_')?'★ ':'')+sectorName(v)+'指數';return ITEM[+v]?.n||v}
function bucketSeries(es,start,step,n){
  const out=new Array(n).fill(null),vol=new Array(n).fill(0);const bk=Array.from({length:n},()=>[]);
  es.forEach(x=>{const i=Math.floor((x.t-start)/step);if(i>=0&&i<n){bk[i].push(x);vol[i]+=x.q}});
  let last=null;for(let i=0;i<n;i++){const m=wmedian(bk[i]);if(m!=null)last=m;out[i]=last}
  const fi=out.findIndex(v=>v!=null);if(fi<0)return null;
  return {p:out,vol,fi};
}
function wallSeries(tok,rg){
  const R=WALL_RANGES[rg];const end=Math.ceil(nowS()/R.step)*R.step;const start=end-R.n*R.step;
  const [k,v]=tok.split(':');
  if(k==='i'){
    const id=+v;const h=(rg==='month'?S.hist30:S.hist)[id];if(!h)return null;
    const q=mainQ(id);const es=h.e.filter(x=>x.hq===q&&(!S.scope||x.w===S.scope));
    const s=bucketSeries(es,start,R.step,R.n);if(!s)return null;
    return {...s,start,abs:true};
  }
  if(rg==='month')return null; // 類股指數只有 8 天資料
  if(v.startsWith('c_')&&!customOf(v))return null;
  const ids=sectorIds(v);
  let num=new Array(R.n).fill(0),den=0;const vol=new Array(R.n).fill(0);
  ids.forEach(id=>{const st=stats(id);if(!(st.dAmt>0))return;const s=bucketSeries(st.es,start,R.step,R.n);if(!s)return;
    const p=s.p.map(v=>v??s.p[s.fi]);for(let i=0;i<R.n;i++){num[i]+=st.dAmt*p[i]/p[0];vol[i]+=s.vol[i]*p[i]}den+=st.dAmt});
  if(!den)return null;
  return {p:num.map(x=>1000*x/den),vol,start,abs:false,fi:0};
}
function drawCompare(cv,lines,labels,hover){
  const {g,W,H}=setupCanvas(cv);g.clearRect(0,0,W,H);
  const MU=CSSV('--muted');g.font='11px '+CSSV('--mono');
  const valid=lines.filter(l=>l.pct);
  if(!valid.length){g.fillStyle=MU;g.fillText('沒有可比較的資料',W/2-50,H/2);return null}
  const padL=10,padR=64,padT=14,padB=24;const n=labels.length;
  const allv=valid.flatMap(l=>l.pct).filter(v=>v!=null);let mn=Math.min(0,...allv),mx=Math.max(0,...allv);const r=(mx-mn)||1;mn-=r*.08;mx+=r*.08;
  const X=i=>padL+i/(n-1)*(W-padL-padR),Y=v=>padT+(mx-v)/(mx-mn)*(H-padT-padB);
  // 網格
  g.strokeStyle='#18202c';g.fillStyle=MU;
  for(let i=0;i<=6;i++){const v=mn+(mx-mn)*i/6;g.beginPath();g.moveTo(padL,Y(v));g.lineTo(W-padR,Y(v));g.stroke();g.fillText((v>0?'+':'')+v.toFixed(1)+'%',W-padR+6,Y(v)+4)}
  const every=Math.ceil(n/8);for(let i=0;i<n;i+=every){g.beginPath();g.moveTo(X(i),padT);g.lineTo(X(i),H-padB);g.stroke();g.fillText(labels[i],Math.max(padL,X(i)-14),H-6)}
  g.setLineDash([5,4]);g.strokeStyle='#6b7280';g.beginPath();g.moveTo(padL,Y(0));g.lineTo(W-padR,Y(0));g.stroke();g.setLineDash([]);
  valid.forEach(l=>{
    g.strokeStyle=l.color;g.lineWidth=l.focus?2.6:1.6;g.globalAlpha=l.dim?.25:1;g.beginPath();
    let st=false;l.pct.forEach((v,i)=>{if(v==null)return;st?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));st=true});g.stroke();
    // 末端標籤
    const lv=l.pct[n-1];g.fillStyle=l.color;g.beginPath();g.arc(X(n-1),Y(lv),3,0,7);g.fill();
    g.globalAlpha=1;g.lineWidth=1;
  });
  if(hover!=null){g.strokeStyle='#9aa3b2';g.setLineDash([3,3]);g.beginPath();g.moveTo(X(hover)+.5,padT);g.lineTo(X(hover)+.5,H-padB);g.stroke();g.setLineDash([]);
    valid.forEach(l=>{if(l.pct[hover]==null)return;g.fillStyle=l.color;g.beginPath();g.arc(X(hover),Y(l.pct[hover]),3.5,0,7);g.fill()})}
  return {padL,padR,W,n};
}
function miniSvg(p0,vol,w=240,h=64,fi=0){
  const p=p0.map(v=>v??p0[fi]);const pv=p0.slice(fi);const mn=Math.min(...pv),mx=Math.max(...pv),r=(mx-mn)||1;const vh=14,ph=h-vh-2;
  const X=i=>(i/(p.length-1)*w).toFixed(1),Y=v=>(2+(mx-v)/r*(ph-4)).toFixed(1);
  const up=p[p.length-1]>=p[fi];const c=up?'var(--up)':'var(--down)';const gid='g'+Math.random().toString(36).slice(2,8);
  const line=p.map((v,i)=>i<fi?'':`${i>fi?'L':'M'}${X(i)},${Y(v)}`).join('');
  const vm=Math.max(1,...vol);const bw=Math.max(1,w/p.length-1);
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;height:${h}px">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#ff4d55':'#22c07a'}" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
     <path d="${line}L${w},${ph}L${X(fi)},${ph}Z" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    ${vol.map((v,i)=>v?`<rect x="${(i/p.length*w).toFixed(1)}" y="${(h-v/vm*vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v/vm*vh).toFixed(1)}" fill="#3b4558"/>`:'').join('')}</svg>`;
}

const charOf=id=>S.chars.find(c=>c.id===id);
const charLabel=c=>`${c.name}@${WN[c.world]||'?'}`;   // 角色名稱只在同一伺服器內唯一，顯示時一律帶伺服器
const charName=id=>{const c=charOf(id);return c?charLabel(c):'未指定角色'};
const tradeKey=x=>x.side==='sell'?`s|${x.itemId}|${x.t}|${x.p}|${x.q}|${x.world}`:`${x.itemId}|${x.t}|${x.p}|${x.q}`;

  if(S.jview==='all')return S.journal;
  if(S.jview==='none')return S.journal.filter(r=>!charOf(r.charId));
  return S.journal.filter(r=>r.charId===S.jview);
}
function calcBook(recs){
  const pos={};let realized=0,totalBuy=0,unmatched=0;
  [...recs].sort((a,b)=>a.time-b.time).forEach(r=>{
    const k=r.itemId+'|'+(r.hq?1:0);const p=pos[k]=pos[k]||{itemId:r.itemId,hq:!!r.hq,qty:0,cost:0,realized:0,buyCost:0};
    if(r.side==='buy'){const c=r.price*r.qty*(1+(r.tax||0)/100);p.qty+=r.qty;p.cost+=c;p.buyCost+=c;totalBuy+=c}
    else if(r.side==='adj'){const avg=p.qty>0?p.cost/p.qty:0;
      if(r.qty<0){const mq=Math.min(-r.qty,p.qty);p.cost-=avg*mq;p.qty-=mq}else{p.cost+=avg*r.qty;p.qty+=r.qty}}
    else{const avg=p.qty>0?p.cost/p.qty:0;const mq=Math.min(r.qty,p.qty);const rz=(r.price*(1-(r.tax||0)/100)-avg)*mq;p.realized+=rz;realized+=rz;p.cost-=avg*mq;p.qty-=mq;if(r.qty>mq)unmatched++}
  });
  return {pos:Object.values(pos),realized,totalBuy,unmatched};
}

/* 掃描：買入看成交紀錄的 buyerName（全 DC 伺服器，可跨服），賣出看雇員上架是否消失且有對應成交 */
/* 減少對 Universalis 的存取：
   1. 沿用全站的請求節流（同時 4 個、每秒最多 8 個），不另外加速
   2. 同一角色 10 分鐘內不重掃（市場資料要有人上傳才會變）
   3. 再次掃描時先查各伺服器「最近更新的物品」（每服 1 個請求），只要涵蓋到上次掃描，就只查這些有變動的物品 */
const SCAN_COOLDOWN=10*60*1000;
const scanAge=c=>Math.min(S.detect[c.id]?.t||0,c.rets?.length?(S.rsnap[c.id]?.t||0):Infinity);
const scanWait=c=>Math.max(0,SCAN_COOLDOWN-(Date.now()-scanAge(c)));
async function changedItemsSince(t){
  // 每服 1 個請求：順便更新「玩家最後上傳時間」；再判斷能不能只查有變動的物品
  const ids=new Set();let full=!t;
  for(const [w] of WORLDS){
    let d;try{d=await getJSON(`${API}/v2/extra/stats/most-recently-updated?world=${w}&entries=200`,{persist:false,ttl:0})}catch{full=true;continue}
    const it=d?.items||[];if(it.length)noteUpload(w,Math.max(...it.map(x=>x.lastUploadTime)));
    if(full)continue;
    if(it.length>=200&&Math.min(...it.map(x=>x.lastUploadTime))>t){full=true;continue}  // 200 筆沒蓋到上次掃描 → 全掃
    it.forEach(x=>{if(x.lastUploadTime>=t&&ITEM[x.itemID])ids.add(x.itemID)});
  }
  return full?null:[...ids];
}
const SCANP={done:0,total:0,msg:''};
async function scanChars(chars){
  Object.assign(SCANP,{done:0,total:0});
  const rc=chars.filter(c=>c.rets?.length);
  showOverlay(`掃描 ${chars.map(charLabel).join('、')} 的交易紀錄`,'檢查哪些物品有更新…');
  try{
    const since=Math.min(...chars.map(scanAge));
    const ids=await changedItemsSince(since?since-120000:0);   // null＝全部物品
    await Promise.all([scanBuys(chars,ids),rc.length?scanRetainers(rc,ids):null]);
  }finally{lsSet('aex_detect',S.detect);lsSet('aex_rsnap',S.rsnap);hideOverlay();renderUpd()}
}
function scanMsg(m){SCANP.msg=m;setProgress(SCANP.total?SCANP.done/SCANP.total:0,`${m}・${SCANP.done} / ${SCANP.total} 批`)}
async function runBatches(tasks){
  SCANP.total+=tasks.length;let fails=0;
  await Promise.all(tasks.map(async([url,onData,onFail])=>{
    try{onData(await getJSON(url,{persist:false,ttl:0}))}catch(e){console.warn('scan',e);fails++;onFail&&onFail()}
    SCANP.done++;scanMsg(SCANP.msg);
  }));
  return fails;
}
async function scanBuys(chars,only){
  // 角色＝名稱＋伺服器。但成交紀錄只有買家名稱、沒有買家所屬伺服器（任何角色都能跨服購買），
  // 所以登記了同名角色（不同伺服器）時無從判斷是誰買的：這筆會列在每個同名角色底下，標「同名待確認」，由使用者選擇歸屬
  const names=new Map();chars.forEach(c=>{const k=lc(c.name);names.set(k,[...(names.get(k)||[]),c])});
  const found={};chars.forEach(c=>found[c.id]=[]);
  // 增量掃描：掃過的角色只抓上次掃描之後（多留 1 小時緩衝）的成交，資料量小很多
  const lastT=Math.min(...chars.map(c=>S.detect[c.id]?.t||0));
  const within=lastT?Math.min(7*DAY,Math.ceil((Date.now()-lastT)/1000)+3600):7*DAY;
  const since=Date.now()/1000-within;const hot=new Set();
  const F='items.itemID,items.entries.buyerName,items.entries.timestamp,items.entries.pricePerUnit,items.entries.quantity,items.entries.hq,items.entries.worldID';
  const take=(id,x,w)=>{const cs=names.get(lc(x.buyerName));if(!cs)return;const world=w??x.worldID;
    const amb=cs.length>1;cs.forEach(ch=>found[ch.id].push({itemId:id,t:x.timestamp,p:x.pricePerUnit,q:x.quantity,hq:!!x.hq,world,...(amb?{amb:true}:{})}))};
  scanMsg(lastT?`買入：上次掃描後的新成交`:'買入：全 DC 近 7 天');
  let fails=await runBatches(chunk(only||ITEMS.map(it=>it.id),100).map(c=>[`${API}/v2/history/${enc(DC)}/${c.join(',')}?entriesToReturn=999&entriesWithin=${within}&fields=${F}`,
    d=>Object.values(itemsOf(d)).forEach(it=>{const e=it.entries||[];
      // 熱門物品在 DC 範圍內 999 筆蓋不到 7 天，之後改逐服掃描
      if(e.length>=999&&e[e.length-1].timestamp>since){hot.add(it.itemID);return}
      e.forEach(x=>take(it.itemID,x))})]));
  if(hot.size){
    scanMsg(`買入：${hot.size} 個熱門物品逐服補掃`);
    const tasks=[];WORLDS.forEach(([w])=>chunk([...hot],100).forEach(c=>tasks.push([`${API}/v2/history/${w}/${c.join(',')}?entriesToReturn=999&entriesWithin=${within}&fields=${F}`,
      d=>Object.values(itemsOf(d)).forEach(it=>(it.entries||[]).forEach(x=>take(it.itemID,x,w)))])));
    fails+=await runBatches(tasks);
  }
  // 新結果併入舊結果（保留 30 天內），有批次失敗就不推進掃描時間，下次會重抓這段
  const keep=Date.now()/1000-30*DAY;
  chars.forEach(c=>{const d=S.detect[c.id]=S.detect[c.id]||{};const m=new Map();
    [...(d.found||[]).filter(x=>x.t>=keep),...found[c.id]].forEach(x=>m.set(tradeKey(x),x));
    d.found=[...m.values()].sort((a,b)=>b.t-a.t);if(!fails||!d.t)d.t=Date.now()});
}
async function scanRetainers(chars,only){
  const rkey=(w,n)=>w+'|'+lc(n);
  const rmap=new Map();chars.forEach(c=>c.rets.forEach(r=>rmap.set(rkey(r.world,r.name),{c,r})));
  const cur={};chars.forEach(c=>cur[c.id]=[]);const failed=new Set();
  // 只查有變動的物品時，其餘物品的上架沿用上次快照（當作沒查，不判定下架）
  if(only){const os=new Set(only);chars.forEach(c=>(S.rsnap[c.id]?.list||[]).forEach(l=>{if(!os.has(l.itemId))failed.add(l.itemId)}))}
  const F='items.itemID,items.worldUploadTimes,items.listings.retainerName,items.listings.worldID,items.listings.pricePerUnit,items.listings.quantity,items.listings.hq';
  scanMsg('雇員上架');
  await runBatches(chunk(only||ITEMS.map(it=>it.id),100).map(c=>[`${API}/v2/${enc(DC)}/${c.join(',')}?listings=999&entries=0&fields=${F}`,
    d=>Object.values(itemsOf(d)).forEach(it=>{(it.listings||[]).forEach(l=>{const m=rmap.get(rkey(l.worldID,l.retainerName));
      if(m)cur[m.c.id].push({itemId:it.itemID,p:l.pricePerUnit,q:l.quantity,hq:!!l.hq,world:l.worldID,ret:m.r.name,seen:it.worldUploadTimes?.[l.worldID]||Date.now()})});
      Object.entries(it.worldUploadTimes||{}).forEach(([w,ts])=>{if(WN[w])noteUpload(+w,ts)})}),
    ()=>c.forEach(id=>failed.add(id))]),'');
  // 上次快照有、這次不見的掛單 → 找同服、同價、同量、同品質、在上次看到之後的成交
  const key=l=>[lc(l.ret),l.world,l.itemId,l.hq?1:0,l.p,l.q].join('|');
  const gone=[];
  chars.forEach(c=>{
    const prev=(S.rsnap[c.id]?.list||[]).filter(l=>rmap.has(rkey(l.world,l.ret)));const now=cur[c.id];
    const cnt=new Map();now.forEach(l=>cnt.set(key(l),(cnt.get(key(l))||0)+1));
    prev.forEach(l=>{if(failed.has(l.itemId)){now.push(l);return}const k=key(l),n=cnt.get(k)||0;if(n>0)cnt.set(k,n-1);else gone.push({c,l})});
  });
  const sold={};chars.forEach(c=>sold[c.id]=[]);
  if(gone.length){
    const ids=[...new Set(gone.map(g=>g.l.itemId))];
    const within=Math.ceil((Date.now()-Math.min(...gone.map(g=>g.l.seen)))/1000)+3600;
    const hist={};
    scanMsg(`比對 ${gone.length} 筆下架的掛單是否賣出`);
    await runBatches(chunk(ids,100).map(c=>[`${API}/v2/history/${enc(DC)}/${c.join(',')}?entriesToReturn=999&entriesWithin=${Math.min(within,30*DAY)}`,
      d=>Object.values(itemsOf(d)).forEach(it=>hist[it.itemID]=it.entries||[])]),'');
    const used=new Set();
    gone.sort((a,b)=>a.l.seen-b.l.seen).forEach(({c,l})=>{
      const e=(hist[l.itemId]||[]).find(x=>!used.has(x)&&x.worldID===l.world&&!!x.hq===l.hq&&x.pricePerUnit===l.p&&x.quantity===l.q&&x.timestamp*1000>=l.seen-300000);
      if(e){used.add(e);sold[c.id].push({side:'sell',itemId:l.itemId,t:e.timestamp,p:l.p,q:l.q,hq:l.hq,world:l.world,ret:l.ret,buyer:e.buyerName})}
    });
  }
  chars.forEach(c=>{const d=S.detect[c.id]=S.detect[c.id]||{};
    const have=new Set((d.sold||[]).map(tradeKey));
    d.sold=[...(d.sold||[]),...sold[c.id].filter(x=>!have.has(tradeKey(x)))].sort((a,b)=>b.t-a.t).slice(0,500);d.ts=Date.now();
    S.rsnap[c.id]={t:Date.now(),list:cur[c.id]};
  });
}
/* 跨服購買確認：角色同一時間只會在一個伺服器，確認一筆「是我」後，
   同角色、同伺服器、彼此間隔 1 小時內連續的待處理買入視為同一趟，一起加入 */
const SESSION_GAP=3600;
function sessionOf(charId,x){
  const have=new Set(S.journal.map(r=>r.src).filter(Boolean));
  const pool=(S.detect[charId]?.found||[]).filter(f=>f.world===x.world&&!have.has(tradeKey(f))&&!S.ignored.has(tradeKey(f)));
  const out=[x];const inSet=new Set([tradeKey(x)]);let grew=true;
  while(grew){grew=false;for(const f of pool){const k=tradeKey(f);if(inSet.has(k))continue;
    if(out.some(o=>Math.abs(o.t-f.t)<=SESSION_GAP)){out.push(f);inSet.add(k);grew=true}}}
  return out;
}
function importTrade(charId,x){
  const ch=charOf(charId);const sell=x.side==='sell';
  S.journal.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),charId,itemId:x.itemId,side:sell?'sell':'buy',price:x.p,qty:x.q,hq:x.hq,
    world:x.world||ch?.world,tax:S.tax[x.world]??5,time:x.t*1000,note:'自動偵測',src:tradeKey(x),ret:sell?x.ret:undefined});
}
function detectedRows(){
  const chars=S.jview==='all'?S.chars:S.chars.filter(c=>c.id===S.jview);
  const have=new Set(S.journal.map(r=>r.src).filter(Boolean));
  const rows=[];const byK=new Map();
  chars.forEach(c=>{const d=S.detect[c.id]||{};[...(d.found||[]),...(d.sold||[])].forEach(x=>{const k=tradeKey(x);
    if(x.amb&&byK.has(k)){byK.get(k).cands.push(c);return}
    const row={c,x,k,cands:[c],added:have.has(k),ign:S.ignored.has(k)};if(x.amb)byK.set(k,row);rows.push(row)})});
  // 同名待確認的候選＝所有登記了這個名稱的角色（不只目前檢視中的）
  rows.forEach(r=>{if(r.x.amb)r.cands=S.chars.filter(c=>lc(c.name)===lc(r.c.name)&&(S.detect[c.id]?.found||[]).some(f=>tradeKey(f)===r.k))});
  return {chars,rows:rows.sort((a,b)=>b.x.t-a.x.t)};
}

function pushUndo(label){S.undo.push({label,journal:JSON.parse(JSON.stringify(S.journal))});if(S.undo.length>10)S.undo.shift();try{localStorage.setItem('aex_undo',JSON.stringify(S.undo))}catch{S.undo=S.undo.slice(-2);lsSet('aex_undo',S.undo)}}

/* 持倉調整：把目前檢視中某物品的數量改成 target。合併檢視時，減少量從持有最多的角色依序扣 */
function holdingByChar(itemId,hq){
  const recs=jRecords();const ids=[...new Set(recs.map(r=>r.charId??null))];
  return ids.map(cid=>{const p=calcBook(recs.filter(r=>(r.charId??null)===cid)).pos.find(x=>x.itemId===itemId&&x.hq===hq);return {cid,qty:p?.qty||0}}).filter(x=>x.qty>0);
}
function adjustHolding(itemId,hq,target,now=Date.now()){
  const by=holdingByChar(itemId,hq);const cur=by.reduce((s,x)=>s+x.qty,0);let d=target-cur;if(!d)return 0;
  const mk=(cid,q)=>S.journal.push({id:now.toString(36)+Math.random().toString(36).slice(2,6),charId:cid,itemId,side:'adj',price:0,qty:q,hq,world:charOf(cid)?.world||null,tax:0,time:now,note:q<0?'手動減少持倉':'手動增加持倉'});
  if(d<0){for(const x of by.sort((a,b)=>b.qty-a.qty)){if(!d)break;const take=Math.min(x.qty,-d);mk(x.cid,-take);d+=take}}
  else mk(charOf(S.jview)?S.jview:(by.sort((a,b)=>b.qty-a.qty)[0]?.cid??S.chars[0]?.id??null),d);
  return 1;
}
document.addEventListener('click',ev=>{

    const cur=holdingByChar(itemId,hq).reduce((s,x)=>s+x.qty,0);const name=(ITEM[itemId]?.n||itemId)+(hq?' HQ':'');
    const v=prompt(`「${name}」目前持有 ${fmt(cur)}，要改成多少？`,cur);if(v==null)return;const n=Math.round(+v);
    if(!(n>=0))return toast('請輸入 0 以上的數字');if(n===cur)return;
    pushUndo(`${name} 數量 ${fmt(cur)} → ${fmt(n)}`);adjustHolding(itemId,hq,n);saveJournal();toast('已調整持倉');route();return}
  if(el=t.closest('[data-holddel]')){const [id,h]=el.dataset.holddel.split('|');const itemId=+id,hq=h==='1';const name=(ITEM[itemId]?.n||itemId)+(hq?' HQ':'');
    pushUndo(`刪除持倉 ${name}`);adjustHolding(itemId,hq,0);saveJournal();toast(`已刪除持倉 ${name}，可按「復原」`);route();return}
  if(t.closest('[data-holdclear]')){const pos=calcBook(jRecords()).pos.filter(p=>p.qty>0);
    if(!confirm(`把目前檢視中的 ${pos.length} 項持倉全部歸零？\n交易紀錄會保留，並新增調整紀錄；之後可以按「復原」。`))return;
    pushUndo(`全部刪除持倉（${pos.length} 項）`);const now=Date.now();pos.forEach(p=>adjustHolding(p.itemId,p.hq,0,now));saveJournal();toast('已清空持倉，可按「復原」');route();return}
});
/* 交易紀錄表：期間／買賣／物品篩選，按日分組，一次顯示 JT_PAGE 筆 */
S.jf=Object.assign({days:30,side:'all',q:''},lsGet('aex_jfilter',{}));S.jlimit=50;

/* 成交價對比目前股價：高於＝紅、低於＝綠、±1% 內＝灰（手機版單價欄隱藏時改為金額上色） */
function vsNow(itemId,hq,p){const h=S.hist[itemId];if(!h||!p)return null;const st=statsOf(h.e,!!hq,null);return st.price?(p/st.price-1)*100:null}
const vsCls=d=>d==null?'':d>1?'up':d<-1?'down':'flat';
const vsRow=d=>d==null||Math.abs(d)<=1?'':d>0?'vsr-up':'vsr-down';
const vsTag=d=>d==null?'':`<span class="vs">${Math.abs(d)<=1?'≈':(d>0?'▲':'▼')+fmt(Math.min(999,Math.abs(d)),0)+'%'}</span>`;
const vsTitle=(itemId,hq,d)=>{if(d==null)return '沒有目前股價可比較';const st=statsOf(S.hist[itemId].e,!!hq,null);return `目前股價 ${fmt(st.price)}，這筆${Math.abs(d)<=1?'和股價差不多':(d>0?'高於':'低於')+'股價 '+fmt(Math.abs(d),1)+'%'}`};
const recAmt=r=>r.side==='adj'?0:r.side==='buy'?r.price*r.qty*(1+(r.tax||0)/100):r.price*r.qty*(1-(r.tax||0)/100);
function journalTable(){
  const merged=S.jview==='all';const cols=merged?10:9;
  const all=jRecords();const q=S.jf.q.trim();
  const from=S.jf.days?Date.now()-S.jf.days*DAY*1000:0;
  const list=all.filter(r=>r.time>=from&&(S.jf.side==='all'||r.side===S.jf.side)&&(!q||(ITEM[r.itemId]?.n||'').includes(q))).sort((a,b)=>b.time-a.time);
  const sum=side=>list.filter(r=>r.side===side).reduce((s,r)=>s+recAmt(r),0);const nb=list.filter(r=>r.side==='buy').length,ns=list.filter(r=>r.side==='sell').length;
  if(!list.length)return `<div class="empty">${all.length?'這個期間沒有符合條件的紀錄。':'還沒有紀錄。可以掃描自動偵測，或按「手動新增」。'}</div>`;
  const shown=list.slice(0,S.jlimit);
  const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()};
  const daySum={};list.forEach(r=>{const k=dayKey(r.time);const o=daySum[k]=daySum[k]||{b:0,s:0,n:0};o.n++;if(r.side==='buy')o.b+=recAmt(r);else if(r.side==='sell')o.s+=recAmt(r)});
  let lastDay='';
  const rows=shown.map(r=>{const k=dayKey(r.time);let head='';
    if(k!==lastDay){lastDay=k;const d=new Date(r.time);const o=daySum[k];
      head=`<tr><td colspan=${cols} class="l" style="background:var(--panel2);font-weight:600;padding-top:7px">${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）
        <span class="muted" style="font-weight:400;margin-left:10px">${o.n} 筆${o.b?`・買入 <span class="up">${fmt(o.b)}</span>`:''}${o.s?`・賣出 <span class="down">${fmt(o.s)}</span>`:''}</span></td></tr>`}
    const tm=new Date(r.time);const hh=String(tm.getHours()).padStart(2,'0')+':'+String(tm.getMinutes()).padStart(2,'0');
    return head+`<tr class="${r.side==='adj'?'':vsRow(vsNow(r.itemId,r.hq,r.price))}"><td class="num l muted">${hh}</td>${merged?`<td class="l hm">${esc(charName(r.charId))}</td>`:''}<td class="l ${r.side==='buy'?'up':r.side==='sell'?'down':'muted'}">${r.side==='buy'?'買入':r.side==='sell'?'賣出':'調整'}</td>
      <td class="l"><a href="#/item/${r.itemId}">${esc(ITEM[r.itemId]?.n||r.itemId)}</a>${r.hq?'<span class="hq">HQ</span>':''}</td><td class="l hm">${WN[r.world]||'—'}${r.side==='sell'&&r.ret?`<span class="muted">・${esc(r.ret)}</span>`:''}</td>
      ${r.side==='adj'?`<td class="num muted hm">—</td><td class="num">${r.qty>0?'+':''}${fmt(r.qty)}</td><td class="num muted">—`:(d=>`<td class="num hm" title="${vsTitle(r.itemId,r.hq,d)}">${fmt(r.price)}${vsTag(d)}</td><td class="num">${fmt(r.qty)}</td><td class="num" title="${vsTitle(r.itemId,r.hq,d)}">${fmt(recAmt(r))}`)(vsNow(r.itemId,r.hq,r.price))}${r.side!=='adj'&&r.tax?`<span class="muted" style="font-size:11px">（稅 ${r.tax}%）</span>`:''}</td><td class="l muted hm">${esc(r.note)}</td>
      <td style="white-space:nowrap">${r.side==='adj'?'':`<button class="btn sm" data-edit="${r.id}">編輯</button> `}<button class="btn sm" data-del="${r.id}">刪除</button></td></tr>`}).join('');
  return `<div class="note" style="margin:0 0 4px">整列底色＝成交單價對比目前股價：<span class="vs-key up">紅底＝高於股價</span> <span class="vs-key down">綠底＝低於股價</span> ±1% 內不上色（買入綠底、賣出紅底代表比現在划算）</div><div class="note" style="margin:0 0 8px">${S.jf.days?`近 ${S.jf.days} 天`:'全部期間'}：${list.length} 筆${nb?`・買入 <span class="up">${fmt(sum('buy'))}</span>（${nb} 筆）`:''}${ns?`・賣出 <span class="down">${fmt(sum('sell'))}</span>（${ns} 筆）`:''}${nb&&ns?`・淨收支 ${signed(sum('sell')-sum('buy'))}`:''}</div>
    <table class="t-jr"><tr><th class="l">時間</th>${merged?'<th class="l hm">角色</th>':''}<th class="l">買賣</th><th class="l">物品</th><th class="l hm">伺服器</th><th class="hm">單價</th><th>數量</th><th>金額</th><th class="l hm">備註</th><th></th></tr>${rows}</table>
    ${list.length>shown.length?`<div style="text-align:center;margin-top:10px"><button class="btn" data-jfmore="1">再顯示 ${Math.min(JT_PAGE,list.length-shown.length)} 筆（還有 ${list.length-shown.length} 筆）</button></div>`:''}`;
}

/* 批次登記：一次輸入多筆。賣出照遊戲「出售記錄」畫面輸入（數量、實收總價、購買人、交易時間），
   儲存時到 Universalis 比對同伺服器、同數量、同時間（、同購買人）的成交，對到就用精確單價、時間與實際稅率 */
function parseGameTime(str){
  str=(str||'').trim();if(!str)return Date.now();
  const m=str.match(/^(?:(\d{4})[\/\-.])?(\d{1,2})[\/\-.](\d{1,2})\s+(\d{1,2}):(\d{2})$/);if(!m)return null;
  const now=new Date();let y=m[1]?+m[1]:now.getFullYear();
  let d=new Date(y,+m[2]-1,+m[3],+m[4],+m[5]);if(!m[1]&&d.getTime()>Date.now()+DAY*1000)d=new Date(y-1,+m[2]-1,+m[3],+m[4],+m[5]);
  return isNaN(d)?null:d.getTime();
}
// 稅率依城市不同（0%～5%）：從實收總價找出能還原成整數單價、且乘回去等於實收的稅率
function inferTax(net,q,def){
  for(const t of [...new Set([def,5,3,0,4,2,1])]){
    const unit=Math.round(net/q/(1-t/100));if(unit<=0)continue;
    const g=unit*q*(1-t/100);if(Math.floor(g+1e-6)===net||Math.round(g)===net)return {t,unit,exact:true};
  }
  return {t:def,unit:net/q/(1-def/100),exact:false};
}

      const e=cands.sort((a,b)=>Math.abs(a.timestamp*1000-r.t)-Math.abs(b.timestamp*1000-r.t))[0];
      const base={id:Date.now().toString(36)+r.i+Math.random().toString(36).slice(2,6),charId:c?.id||null,itemId:r.itemId,side:st.side,qty:r.q,hq:r.hq,world,note:'批次登記',ret};
      if(e){matched++;const src=tradeKey({side:st.side,itemId:r.itemId,t:e.timestamp,p:e.pricePerUnit,q:e.quantity,world});used.add(src);
        // 賣出：用實收總價反推實際稅率
        const tx=sell()?Math.max(0,Math.min(10,Math.round((1-r.v/(e.pricePerUnit*e.quantity))*1000)/10)):tax;
        return {...base,price:e.pricePerUnit,tax:tx,time:e.timestamp*1000,src,note:'批次登記・已比對'}}
      return {...base,price:Math.round(r.unit*100)/100,tax:r.tax??tax,time:r.t};
    });
    pushUndo(`批次登記 ${recs.length} 筆`);S.journal.push(...recs);lsSet('aex_lastworld',world);saveJournal();closeModal();
    toast(`已登記 ${recs.length} 筆${matched?`，其中 ${matched} 筆對到成交紀錄（精確單價與時間）`:''}，可按「復原」`);
    if(location.hash.startsWith('#/journal'))route();else location.hash='#/journal';
  };
}

    S.chars=S.chars.filter(x=>x.id!==c.id);S.journal.forEach(r=>{if(r.charId===c.id)r.charId=null});delete S.detect[c.id];

  if(t.closest('[data-scan]')){const all=S.jview==='all'?S.chars:S.chars.filter(c=>c.id===S.jview);const chars=all.filter(c=>!scanWait(c));

  if(t.closest('[data-detall]')){S.showDetAll=!S.showDetAll;route();return}
  if(el=t.closest('[data-detimport]')){

    else{const [cid,k]=v.split('::');const d=S.detect[cid]||{};const x=[...(d.found||[]),...(d.sold||[])].find(f=>tradeKey(f)===k);if(x){importTrade(cid,x);toast('已加入紀錄')}}

/* ========== 搜尋 ========== */
function isSubseq(s,q){let i=0;for(const c of s){if(c===q[i])i++;if(i===q.length)return true}return false}
function searchItems(q,limit=20){
  q=q.trim();if(!q)return [];
  if(/^\d+$/.test(q)){const n=String(+q);const cs=new Set(allCons());
    return ITEMS.filter(it=>String(it.id).startsWith(n)).sort((a,b)=>(+cs.has(b.id))-(+cs.has(a.id))||String(a.id).length-String(b.id).length||a.id-b.id).slice(0,limit)}
  const terms=q.split(/\s+/);const res=[];
  for(const it of ITEMS){const n=it.n;let s;
    if(n===q)s=0;else if(n.startsWith(q))s=1;else if(n.includes(q))s=2;
    else if(terms.length>1&&terms.every(t=>n.includes(t)))s=3;
    else if(q.length>=2&&isSubseq(n,q.replace(/\s/g,'')))s=4;else continue;
    res.push([s+(allCons().includes(it.id)?-0.5:0),n.length,it]);
  }
  return res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,limit).map(r=>r[2]);
}
function bindSearch(inp,dd,onPick){
  let list=[],sel=0;
  const draw=()=>{dd.innerHTML=list.map((it,i)=>`<div class="opt ${i===sel?'on':''}" data-i="${i}"><span class="code">${codeOf(it.id)}</span>${ico(it)}<span>${esc(it.n)}</span><span class="cat">${it.sec?SEC[it.sec].name+'・':''}${esc(CATS[it.cat]||'')}</span></div>`).join('')||'<div class="opt muted">找不到符合的物品</div>';dd.style.display='block'};
  inp.oninput=()=>{list=searchItems(inp.value);sel=0;inp.value.trim()?draw():dd.style.display='none'};
  inp.onkeydown=ev=>{if(dd.style.display!=='block')return;
    if(ev.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();ev.preventDefault()}
    else if(ev.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();ev.preventDefault()}
    else if(ev.key==='Enter'&&list[sel]){onPick(list[sel]);dd.style.display='none';ev.preventDefault()}
    else if(ev.key==='Escape')dd.style.display='none'};
  dd.onmousedown=ev=>{const o=ev.target.closest('.opt');if(o&&o.dataset.i!=null){onPick(list[+o.dataset.i]);dd.style.display='none';ev.preventDefault()}};
  inp.onblur=()=>setTimeout(()=>dd.style.display='none',150);
}

/* ========== 跑馬燈 ========== */
function renderTicker(all){
  $('#track').innerHTML=all.slice(0,40).map(x=>{const c=x.avg?cls(x.p/x.avg-1):'flat';return `<span class="t" data-go="#/item/${x.id}"><b>${esc(ITEM[x.id]?.n)}</b>${x.hq?'<span class="hq">HQ</span>':''}<span class="num ${c}">${fmt(x.p)}</span><span class="muted num">×${fmt(x.q)}</span><span class="muted">${esc(WN[x.w]||'')}・${tstr(x.t,false)}</span></span>`}).join('');
}
async function loadTicker(){
  if(S.snapMode){const a=(S.snapTicker||[]).filter(x=>ITEM[x.id]&&(!S.scope||x.w===S.scope));if(a.length>=5||!S.scope){renderTicker(a);return}}
  try{
    const sp=S.scope?`world=${S.scope}`:`dcName=${enc(DC)}`;
    const rec=await getJSON(`${API}/v2/extra/stats/most-recently-updated?${sp}&entries=50`);
    const ids=[...new Set((rec?.items||[]).map(x=>x.itemID).filter(id=>ITEM[id]))].slice(0,50);
    if(!ids.length)return;
    const scope=S.scope?S.scope:enc(DC);
    const d=await getJSON(`${API}/v2/${scope}/${ids.join(',')}?listings=0&entries=5`,{persist:false});
    const its=itemsOf(d);const all=[];
    Object.values(its).forEach(it=>(it.recentHistory||[]).filter(h=>!CLOSED.has(h.worldID)&&!(it.averagePrice&&(h.pricePerUnit>it.averagePrice*EXT||h.pricePerUnit<it.averagePrice/EXT))).forEach(h=>all.push({id:it.itemID,p:h.pricePerUnit,q:h.quantity,hq:h.hq,t:h.timestamp,w:h.worldID||S.scope,avg:it.averagePrice})));
    all.sort((a,b)=>b.t-a.t);renderTicker(all);
  }catch(e){console.warn('ticker',e)}
}

/* ========== 路由與事件 ========== */
let TOKEN=0;
async function route(){
  const tok=++TOKEN;renderShell();
  const h=location.hash||'#/';const [,p,arg]=h.split('/');
  try{
    if(!p)renderHome();
    else if(p==='sector')await renderSector(arg&&(SEC[arg]||arg.startsWith('c_'))?arg:null,tok);
    else if(p==='multi')await renderMulti(tok);
    else if(p==='ranks')renderRanks(arg);
    else if(p==='heatmap')renderHeatmap();
    else if(p==='news')renderNews();
    else if(p==='item')await renderItem(+arg,tok);
    else if(p==='servers')renderServers();
    else if(p==='wall')await renderWall(tok);
    else if(p==='watch')await renderWatch(tok);
    else if(p==='journal')await renderJournal(tok);
    else renderHome();
  }catch(e){console.error(e);$('#view').innerHTML=`<div class="empty">發生錯誤：${esc(e.message)}</div>`}
}

  const s=t.closest('[data-star]');if(s){ev.stopPropagation();const id=+s.dataset.star;const i=S.watch.indexOf(id);i>=0?S.watch.splice(i,1):S.watch.push(id);lsSet('aex_watch',S.watch);
    if(s.classList.contains('star'))s.classList.toggle('on');else route();toast(i>=0?'已移出自選股':'已加入自選股');return}
  const lg=t.closest('[data-log]');if(lg){openLog(lg.dataset.log?+lg.dataset.log:null);return}
  const ed=t.closest('[data-edit]');if(ed){openLog(null,ed.dataset.edit);return}
  const dl=t.closest('[data-del]');if(dl){if(confirm('確定刪除這筆紀錄？')){const r=S.journal.find(x=>x.id===dl.dataset.del);pushUndo(`刪除紀錄 ${ITEM[r?.itemId]?.n||''}`);S.journal=S.journal.filter(x=>x.id!==dl.dataset.del);saveJournal();route()}return}
  const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=k==='name'?1:-1}route();return}
  const md=t.closest('[data-mode]');if(md){ITEMV.mode=md.dataset.mode;route();return}
  const qb=t.closest('[data-q]');if(qb){const id=+location.hash.split('/')[2];S.qual[id]=qb.dataset.q==='1';lsSet('aex_qual',S.qual);S.memo.clear();route();return}
  const wr=t.closest('[data-world]');if(wr&&wr.classList.contains('row')){setScope(+wr.dataset.world);if(location.hash.startsWith('#/servers'))location.hash='#/';return}
  const go=t.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
});

$('#refresh').onclick=async()=>{
  if(S.manualT&&Date.now()-S.manualT<60000)return toast('剛刷新過，1 分鐘後再試');
  pruneCache(true);MEM.clear();S.hist30={};S.histL={};S.hist={};
  try{await loadMain(true);showOverlay('手動刷新','讀取稅率與玩家上傳時間');await Promise.all([loadTax(),loadUpload()])}finally{hideOverlay()}
  S.manualT=Date.now();S.updated=S.manualT;
  const sm=S.snapMode;S.snapMode=false;try{await loadTicker()}finally{S.snapMode=sm}

/* ========== 啟動 ========== */
(async function init(){
  pruneCache();
  setInterval(tickET,1000);
  renderShell();
  // 優先讀取雲端整理好的行情；讀不到或太舊才改回瀏覽器自己抓
  showOverlay('載入行情','讀取雲端整理好的資料（每 30 分鐘更新）');setProgress(.3);
  const snapOk=await trySnapshot();
  if(snapOk){hideOverlay()}
  else{
    S.cons=lsGet('aex_cons',null);
    if(!S.cons||Date.now()-S.cons.t>24*3600*1000||!S.cons.sectors)await scanConstituents();
    await loadMain(true);
  }
  route();
  loadTicker();
  if(!snapOk)Promise.all([loadTax(),loadUpload()]).then(()=>{if(location.hash.startsWith('#/servers'))route()});
  setInterval(async()=>{
    const before=S.snapT;
    if(S.snapMode){await trySnapshot();if(S.snapT===before)return}
    else{await loadMain(false);loadUpload()}
    loadTicker();if(!$('#modal').style.display.includes('grid'))route();
  },TTL);
})();

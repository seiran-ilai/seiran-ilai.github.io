<style>
:root{
  --bg:#0a0d13;--panel:#11161f;--panel2:#161c27;--line:#222a38;--text:#d7dce5;--muted:#7c8698;
  --up:#ff4d55;--down:#22c07a;--flat:#9aa3b2;--gold:#e3b54a;--blue:#4ea1ff;
  --mono:"JetBrains Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}.muted{color:var(--muted)}
#app{display:grid;grid-template-columns:176px 1fr;grid-template-rows:56px 34px 1fr;height:100vh;min-width:1200px}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:#0d1119;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#a4721b);display:grid;place-items:center;color:#1a1204;font-family:var(--mono);font-weight:800}
.logo small{display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;font-weight:400}
.search{position:relative;flex:0 1 380px}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 32px;outline:none}
.search input:focus{border-color:var(--gold)}
.search::before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--muted);font-size:16px}
.dropdown{position:absolute;top:40px;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:460px;overflow:auto;z-index:50;display:none;box-shadow:0 12px 30px #0008}
.dropdown .opt{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer}
.dropdown .opt.on,.dropdown .opt:hover{background:#222b3a}
.dropdown .opt .cat{margin-left:auto;font-size:12px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
select.scope{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:700}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.on{border-color:var(--gold);color:var(--gold)}
#ticker{grid-column:1/3;overflow:hidden;background:#0c1017;border-bottom:1px solid var(--line);white-space:nowrap;position:relative}
#ticker .track{display:inline-block;padding-left:100%;animation:tick 160s linear infinite;line-height:34px}
#ticker:hover .track{animation-play-state:paused}
#ticker .t{display:inline-flex;gap:6px;margin-right:28px;cursor:pointer;font-size:13px}
#ticker .lab{position:absolute;left:0;top:0;bottom:0;z-index:2;background:#0c1017;padding:0 12px;line-height:34px;color:var(--gold);font-weight:700;border-right:1px solid var(--line)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
nav{background:#0d1119;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav a{padding:8px 12px;border-radius:7px;color:var(--muted)}
nav a:hover{background:var(--panel2);color:var(--text)}
nav a.on{background:var(--panel2);color:var(--gold);font-weight:700}
nav .sep{height:1px;background:var(--line);margin:8px 4px}
nav .sub{padding-left:22px;font-size:13px}
nav .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:8px}
main{overflow:auto;padding:18px 22px 40px}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .muted{font-weight:400;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:1fr 1fr}
.g3 .name span{max-width:130px}
.compact td,.compact th{white-space:nowrap;font-size:13px;padding:4px 5px}.compact td.b{max-width:90px;overflow:hidden;text-overflow:ellipsis}.panel{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:#3a4458}
.card .t{color:var(--muted);font-size:12px}
.card .v{font-size:22px;font-weight:700}
.card.main{border-color:#4a3a14;background:linear-gradient(160deg,#1a1709,var(--panel) 60%)}
.card svg{position:absolute;right:8px;bottom:6px;opacity:.9}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;text-align:right;border-bottom:1px solid #1a2030}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
tr.row{cursor:pointer}tr.row:hover td{background:#18202d}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--text)}
.name{display:flex;align-items:center;gap:8px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.ico{width:24px;height:24px;border-radius:5px;background:#222;flex:none}
.ico.lg{width:48px;height:48px;border-radius:9px}
.hq{font-size:10px;color:var(--gold);border:1px solid #6b5520;border-radius:3px;padding:0 3px;margin-left:2px}
.star{cursor:pointer;color:#4a5263;font-size:15px;user-select:none}
.star.on{color:var(--gold)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag.red{color:var(--up);border-color:#5a2226}.tag.green{color:var(--down);border-color:#1d4a35}
.rk{color:var(--muted);font-family:var(--mono);width:18px;display:inline-block}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.item-head{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.item-head .p{font-size:30px;font-weight:700}
.item-head .meta{display:flex;flex-direction:column}
.chartbox{position:relative}
canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:#0b0f16ee;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;display:none;z-index:5;white-space:nowrap}
.book td{padding:3px 6px}
.book .bar{position:relative}
.book .bar i{position:absolute;top:2px;bottom:2px;right:0;opacity:.18;border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even){text-align:right}
.hbar{height:8px;background:#1d2431;border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--gold)}
.heat td{text-align:center;font-family:var(--mono);font-size:13px}
#overlay{position:fixed;inset:0;background:#06080cdd;display:none;place-items:center;z-index:100}
#overlay .box{width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.prog{height:8px;background:#1d2431;border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#modal{position:fixed;inset:0;background:#06080ccc;display:none;place-items:center;z-index:90}
#modal .box{width:520px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.form{display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center}
.form input,.form select,.form textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
.form .row2{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 14px;cursor:pointer}
.seg button.on.buy{background:#3a1519;color:var(--up)}.seg button.on.sell{background:#10301f;color:var(--down)}
.empty{color:var(--muted);text-align:center;padding:24px}
.note{font-size:12px;color:var(--muted)}
.wall-top{display:flex;align-items:center;gap:24px;margin-bottom:12px;padding:12px 16px;background:linear-gradient(90deg,#15120a,#0f131b);border:1px solid #3a2f14;border-radius:10px}
.wall-title{font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--gold);display:flex;align-items:center;gap:10px}
.live{font-size:11px;color:var(--up);border:1px solid #5a2226;border-radius:4px;padding:0 6px;letter-spacing:.15em;display:inline-flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.wall-stat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wall-stat b{margin-right:10px}
.clock{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;line-height:1.3}.clock b{color:var(--gold);font-size:22px}
.legend .lg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #1a2030;cursor:default}
.legend .lg:hover{background:#18202d}.legend .lg.off{opacity:.4}
.legend .lg i{width:12px;height:12px;border-radius:3px;flex:none}.legend .lg .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .lg b{color:var(--muted);cursor:pointer;padding:0 4px}.legend .lg b:hover{color:var(--up)}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:background .3s}
.tile:hover{border-color:#3a4458}
.tile .th{display:flex;align-items:center;gap:6px;font-size:13px}.tile .th .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .idx{width:24px;height:24px;border-radius:5px;background:#2a2410;color:var(--gold);display:grid;place-items:center;font-size:12px;flex:none}
.tile .tp{display:flex;align-items:baseline;gap:8px;margin:4px 0}.tile .big{font-size:20px;font-weight:700}
.tile .tf{display:flex;justify-content:space-between;font-size:11px;margin-top:4px}
.tile.fu{animation:fu 1.6s}.tile.fd{animation:fd 1.6s}
@keyframes fu{0%{background:#5a1c22}100%{background:var(--panel)}}@keyframes fd{0%{background:#124a30}100%{background:var(--panel)}}
.toast{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;z-index:120}
</style>
</head>

function fmtBig(n){if(n==null||!isFinite(n))return '—';const a=Math.abs(n);if(a>=1e8)return fmt(n/1e8,2)+' 億';if(a>=1e4)return fmt(n/1e4,1)+' 萬';return fmt(n)}

function iconUrl(icon){const f=String(Math.floor(icon/1000)*1000).padStart(6,'0');return `https://xivapi.com/i/${f}/${String(icon).padStart(6,'0')}.png`}

function tstr(t,withDate=true){const d=new Date(t*1000);const p=n=>String(n).padStart(2,'0');return (withDate?`${p(d.getMonth()+1)}/${p(d.getDate())} `:'')+`${p(d.getHours())}:${p(d.getMinutes())}`}
function chunk(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r}

/* ========== 請求：限流 + 快取 ========== */
const LIM={active:0,queue:[],last:0,MAXC:4,GAP:125,timer:null};
function schedule(fn){return new Promise((res,rej)=>{LIM.queue.push({fn,res,rej});pump()})}
function pump(){
  while(LIM.active<LIM.MAXC&&LIM.queue.length){
    const wait=LIM.last+LIM.GAP-Date.now();
    if(wait>0){if(!LIM.timer)LIM.timer=setTimeout(()=>{LIM.timer=null;pump()},wait);return}
    const job=LIM.queue.shift();LIM.active++;LIM.last=Date.now();
    job.fn().then(job.res,job.rej).finally(()=>{LIM.active--;pump()});
  }
}
const MEM=new Map();const INFLIGHT=new Map();
async function rawFetch(url){
  for(let i=0;i<4;i++){
    let r;try{r=await fetch(url)}catch(e){await new Promise(z=>setTimeout(z,1000*2**i));continue}
    if(r.ok)return r.json();
    if(r.status===404)return null;
    if(r.status===429||r.status>=500){await new Promise(z=>setTimeout(z,800*2**i));continue}
    throw new Error('HTTP '+r.status);
  }
  throw new Error('請求失敗（重試多次）');
}
async function getJSON(url,{ttl=TTL,persist=true}={}){
  const m=MEM.get(url);if(m&&Date.now()-m.t<ttl)return m.d;
  if(persist){const c=lsGet('aex:c:'+url);if(c&&Date.now()-c.t<ttl){MEM.set(url,c);return c.d}}
  if(INFLIGHT.has(url))return INFLIGHT.get(url);
  const p=schedule(()=>rawFetch(url)).then(d=>{
    const rec={t:Date.now(),d};if(ttl>0)MEM.set(url,rec);INFLIGHT.delete(url);
    if(persist){const s=JSON.stringify(rec);if(s.length<250000){try{localStorage.setItem('aex:c:'+url,s)}catch{pruneCache()}}}
    return d;
  },e=>{INFLIGHT.delete(url);throw e});
  INFLIGHT.set(url,p);return p;
}
function pruneCache(all){
  const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('aex:c:'))ks.push(k)}
  ks.forEach(k=>{const c=lsGet(k);if(all||!c||Date.now()-c.t>TTL)localStorage.removeItem(k)});
}

function normEntries(arr){return (arr||[]).filter(x=>!CLOSED.has(x.worldID)).map(x=>({t:x.timestamp,p:x.pricePerUnit,q:x.quantity,hq:!!x.hq,w:x.worldID,b:x.buyerName||''}))}
const EXT=3;
function cleanEntries(e){
  const out=[];let removed=0;
  for(const q of [false,true]){
    const g=e.filter(x=>x.hq===q).sort((a,b)=>a.t-b.t);
    if(g.length<5){out.push(...g);continue}
    g.forEach((x,i)=>{const win=g.slice(Math.max(0,i-10),i+11);const m=wmedian(win);
      if(m&&(x.p>m*EXT||x.p<m/EXT))removed++;else out.push(x)});
  }
  return {e:out,removed};
}
function itemsOf(d){if(!d)return {};if(d.items)return d.items;if(d.itemID!=null)return {[d.itemID]:d};return {}}

async function loadHist(ids,{within=8*DAY,store=S.hist,size=10,onProg}={}){
  const need=ids.filter(id=>!store[id]||Date.now()-store[id].t>TTL);
  const cs=chunk(need,size);let done=0;
  await Promise.all(cs.map(async c=>{
    try{
      const d=await getJSON(`${API}/v2/history/${enc(DC)}/${c.join(',')}?entriesToReturn=999&entriesWithin=${within}`,{persist:false});
      const its=itemsOf(d);
      c.forEach(id=>{const raw=its[id]?.entries||[];const cl=cleanEntries(normEntries(raw));store[id]={t:Date.now(),e:cl.e,removed:cl.removed,raw:raw.length}});
    }catch(e){console.warn('history',e)}
    done++;onProg&&onProg(done,cs.length);
  }));
  S.memo.clear();
}

async function scanConstituents(){
  const ids=ITEMS.filter(it=>it.sec).map(it=>it.id);
  const cs=chunk(ids,100);let done=0;const score={};
  showOverlay('建立成分股','首次使用：掃描全部可交易物品的日銷量與成交均價（結果快取 24 小時）');
  await Promise.all(cs.map(async c=>{
    try{
      const d=await getJSON(`${API}/v2/aggregated/${enc(DC)}/${c.join(',')}`,{persist:false});
      (d?.results||[]).forEach(r=>{
        let t=0;for(const q of ['nq','hq']){const v=r[q]?.dailySaleVelocity?.dc?.quantity||0,p=r[q]?.averageSalePrice?.dc?.price||0;t+=v*p}
        score[r.itemId]=t;
      });
    }catch(e){console.warn('scan',e)}
    done++;setProgress(done/cs.length,`${done} / ${cs.length} 批`);

  SECTORS.forEach(s=>{sectors[s.key]=ITEMS.filter(it=>it.sec===s.key&&score[it.id]>0).sort((a,b)=>score[b.id]-score[a.id]).slice(0,PER_SECTOR).map(it=>it.id)});
  S.cons={t:Date.now(),sectors};lsSet('aex_cons',S.cons);
}

/* ========== 計算 ========== */
function wmedian(es){
  if(!es.length)return null;
  const a=[...es].sort((x,y)=>x.p-y.p);let tot=0;a.forEach(x=>tot+=x.q);
  let c=0;for(const x of a){c+=x.q;if(c>=tot/2)return x.p}
  return a[a.length-1].p;
}
function mainQ(id){
  if(S.qual[id]!=null)return S.qual[id];
  const it=ITEM[id];if(!it?.canHq)return false;
  const e=(S.hist30[id]||S.hist[id])?.e||[];
  let h=0,n=0;e.forEach(x=>x.hq?h+=x.q:n+=x.q);
  return h>n;
}
function statsOf(e,q,world){
  const now=nowS();
  const es=e.filter(x=>x.hq===q&&(!world||x.w===world));
  const today=es.filter(x=>x.t>=now-DAY),prev=es.filter(x=>x.t<now-DAY&&x.t>=now-8*DAY);
  const pT=wmedian(today),pP=wmedian(prev);
  const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  // 999 筆上限：若資料被截斷，前 7 日只涵蓋部分天數，改用實際涵蓋天數換算日均
  let cov=7;
  if(e.length>=999||e._cap){let old=Infinity;for(const x of e)if(x.t<old)old=x.t;cov=Math.max(0,Math.min(7,(now-DAY-old)/DAY))}
  const prevVol=sum(prev,x=>x.q),prevAmt=sum(prev,x=>x.q*x.p);
  return {pT,pP,price:pT??pP,chg:(pT!=null&&pP!=null)?(pT/pP-1)*100:null,cov,truncated:cov<7,
    vol:sum(today,x=>x.q),amt:sum(today,x=>x.q*x.p),prevVol,prevAmt,
    dVol:cov>=0.5?prevVol/cov:null,dAmt:cov>=0.5?prevAmt/cov:null,es,today,prev};
}
function stats(id,world=S.scope){
  const k=id+'|'+world;if(S.memo.has(k))return S.memo.get(k);
  const h=S.hist[id];const s=statsOf(h?(h.raw>=999?Object.assign(h.e,{_cap:true}):h.e):[],mainQ(id),world);S.memo.set(k,s);return s;
}
function indexOf(ids,world=S.scope){
  let num=0,den=0,n=0;
  ids.forEach(id=>{const s=stats(id,world);if(s.pT!=null&&s.pP!=null&&s.dAmt>0){num+=s.dAmt*s.pT/s.pP;den+=s.dAmt;n++}});
  return den?{v:1000*num/den,chg:(num/den-1)*100,n}:{v:null,chg:null,n:0};
}
function indexSeries(ids,world=S.scope){
  const now=nowS();const pts=[];const base={},w={},last={};
  ids.forEach(id=>{const s=stats(id,world);if(s.pP!=null&&s.dAmt>0){base[id]=s.pP;w[id]=s.dAmt;last[id]=s.pP}});
  const keys=Object.keys(base);if(!keys.length)return [];
  for(let k=7;k>=0;k--){
    const a=now-(k+1)*DAY,b=now-k*DAY;let num=0,den=0;
    keys.forEach(id=>{const es=stats(id,world).es.filter(x=>x.t>=a&&x.t<b);const p=wmedian(es);if(p!=null)last[id]=p;num+=w[id]*last[id]/base[id];den+=w[id]});
    pts.push({label:k===0?'今日':`-${k}日`,v:1000*num/den});
  }
  return pts;
}

/* ========== 圖表 ========== */
function sparkline(pts,w=110,h=34){
  if(pts.length<2)return '';
  const vs=pts.map(p=>p.v);const mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn||1;
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i/(pts.length-1)*w).toFixed(1)},${(h-2-(p.v-mn)/r*(h-4)).toFixed(1)}`).join('');
  const c=vs[vs.length-1]>=vs[0]?'var(--up)':'var(--down)';
  return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
}
function setupCanvas(cv){const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return {g,W,H}}
const CSSV=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawLine(cv,pts){
  const {g,W,H}=setupCanvas(cv);g.clearRect(0,0,W,H);
  if(pts.length<2){g.fillStyle=CSSV('--muted');g.fillText('資料不足',W/2-24,H/2);return}
  const padL=10,padR=64,padT=12,padB=24;const vs=pts.map(p=>p.v);
  let mn=Math.min(...vs,1000),mx=Math.max(...vs,1000);const r=(mx-mn)||1;mn-=r*.1;mx+=r*.1;
  const x=i=>padL+i/(pts.length-1)*(W-padL-padR),y=v=>padT+(mx-v)/(mx-mn)*(H-padT-padB);
  g.font='11px '+CSSV('--mono');g.strokeStyle='#1d2431';g.fillStyle=CSSV('--muted');
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g.beginPath();g.moveTo(padL,y(v));g.lineTo(W-padR,y(v));g.stroke();g.fillText(fmt(v,1),W-padR+6,y(v)+4)}
  g.setLineDash([4,4]);g.strokeStyle='#5a6070';g.beginPath();g.moveTo(padL,y(1000));g.lineTo(W-padR,y(1000));g.stroke();g.setLineDash([]);
  const up=vs[vs.length-1]>=1000;const col=up?CSSV('--up'):CSSV('--down');
  const grad=g.createLinearGradient(0,padT,0,H-padB);grad.addColorStop(0,up?'#ff4d5540':'#22c07a40');grad.addColorStop(1,'#0000');
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(x(i),y(p.v)):g.moveTo(x(i),y(p.v)));g.lineTo(x(pts.length-1),H-padB);g.lineTo(x(0),H-padB);g.fillStyle=grad;g.fill();
  g.beginPath();pts.forEach((p,i)=>i?g.lineTo(x(i),y(p.v)):g.moveTo(x(i),y(p.v)));g.strokeStyle=col;g.lineWidth=2;g.stroke();g.lineWidth=1;
  g.fillStyle=CSSV('--muted');pts.forEach((p,i)=>{g.fillText(p.label,x(i)-12,H-6)});
  pts.forEach((p,i)=>{g.beginPath();g.arc(x(i),y(p.v),2.5,0,7);g.fillStyle=col;g.fill()});
}

function buildCandles(es,mode){
  const now=nowS();const out=[];
  let n,start,step;
  if(mode==='hour'){step=3600;n=72;start=Math.floor(now/3600)*3600-(n-1)*3600}
  else{step=DAY;const d=new Date();d.setHours(0,0,0,0);const today=d.getTime()/1000;n=30;start=today-(n-1)*DAY;
    const first=es.length?Math.min(...es.map(x=>x.t)):now;const fs=Math.max(start,Math.floor((first-today)/DAY)*DAY+today);n=Math.round((today-fs)/DAY)+1;start=fs}
  const a=[...es].sort((x,y)=>x.t-y.t);let prevC=null,j=0;
  for(let i=0;i<n;i++){
    const t0=start+i*step,t1=t0+step;const b=[];while(j<a.length&&a[j].t<t1){if(a[j].t>=t0)b.push(a[j]);j++}
    const lab=mode==='hour'?tstr(t0,false):(()=>{const d=new Date(t0*1000);return `${d.getMonth()+1}/${d.getDate()}`})();
    if(b.length){const ps=b.map(x=>x.p);const c={t:t0,lab,o:b[0].p,c:b[b.length-1].p,h:Math.max(...ps),l:Math.min(...ps),v:b.reduce((s,x)=>s+x.q,0),n:b.length};out.push(c);prevC=c.c}
    else out.push(prevC==null?{t:t0,lab,empty:true,none:true}:{t:t0,lab,o:prevC,c:prevC,h:prevC,l:prevC,v:0,empty:true});
  }
  return out;
}
function drawCandles(cv,cs,hover){
  const {g,W,H}=setupCanvas(cv);g.clearRect(0,0,W,H);
  const UP=CSSV('--up'),DN=CSSV('--down'),MU=CSSV('--muted');g.font='11px '+CSSV('--mono');
  const valid=cs.filter(c=>!c.none);
  if(!valid.length){g.fillStyle=MU;g.fillText('此範圍沒有成交紀錄',W/2-50,H/2);return null}
  const padL=8,padR=72,padT=10,labH=20,volH=Math.round(H*.2),gap=14;const priceH=H-padT-labH-volH-gap;
  let hi=Math.max(...valid.map(c=>c.h)),lo=Math.min(...valid.map(c=>c.l));const r=(hi-lo)||hi*.1||1;hi+=r*.08;lo=Math.max(0,lo-r*.08);
  const vmax=Math.max(1,...valid.map(c=>c.v));
  const cw=(W-padL-padR)/cs.length;const X=i=>padL+cw*i+cw/2;const Y=p=>padT+(hi-p)/(hi-lo)*priceH;
  const vTop=padT+priceH+gap;const VY=v=>vTop+volH-(v/vmax)*volH;
  g.strokeStyle='#1a212d';g.fillStyle=MU;
  for(let i=0;i<=4;i++){const p=lo+(hi-lo)*i/4;g.beginPath();g.moveTo(padL,Y(p));g.lineTo(W-padR,Y(p));g.stroke();g.fillText(fmt(p),W-padR+6,Y(p)+4)}
  g.fillText('量 '+fmtBig(vmax),W-padR+6,vTop+10);
  g.beginPath();g.moveTo(padL,vTop+volH+.5);g.lineTo(W-padR,vTop+volH+.5);g.stroke();
  const bw=Math.max(1,Math.min(14,cw*.62));
  cs.forEach((c,i)=>{
    if(c.none)return;const x=X(i);
    if(c.empty){g.strokeStyle='#3a4252';g.beginPath();g.moveTo(x-bw/2,Y(c.c)+.5);g.lineTo(x+bw/2,Y(c.c)+.5);g.stroke();return}
    const col=c.c>=c.o?UP:DN;g.strokeStyle=col;g.fillStyle=col;
    g.beginPath();g.moveTo(x+.5,Y(c.h));g.lineTo(x+.5,Y(c.l));g.stroke();
    const y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
    g.globalAlpha=.75;g.fillRect(x-bw/2,VY(c.v),bw,vTop+volH-VY(c.v));g.globalAlpha=1;
  });
  // MA5
  g.strokeStyle=CSSV('--gold');g.lineWidth=1.2;g.beginPath();let st=false;
  cs.forEach((c,i)=>{if(c.none)return;const w=cs.slice(Math.max(0,i-4),i+1).filter(z=>!z.none);if(w.length<5){st=false;return}
    const m=w.reduce((s,z)=>s+z.c,0)/w.length;if(!st){g.moveTo(X(i),Y(m));st=true}else g.lineTo(X(i),Y(m))});
  g.stroke();g.lineWidth=1;
  g.fillStyle=MU;const every=Math.ceil(cs.length/10);cs.forEach((c,i)=>{if(i%every===0)g.fillText(c.lab,X(i)-14,H-5)});
  if(hover!=null&&cs[hover]){const x=X(hover);g.strokeStyle='#8890a0';g.setLineDash([3,3]);g.beginPath();g.moveTo(x+.5,padT);g.lineTo(x+.5,vTop+volH);g.stroke();g.setLineDash([])}
  return {X,cw,padL};
}
function mountCandles(box,cs){
  const cv=box.querySelector('canvas'),tip=box.querySelector('.tip');let L=drawCandles(cv,cs);
  cv.onmousemove=ev=>{if(!L)return;const rc=cv.getBoundingClientRect();const i=Math.floor((ev.clientX-rc.left-L.padL)/L.cw);
    if(i<0||i>=cs.length||cs[i].none){tip.style.display='none';return}
    L=drawCandles(cv,cs,i);const c=cs[i];
    tip.innerHTML=c.empty?`<b>${c.lab}</b><br><span class="muted">無成交</span>`:
      `<b>${c.lab}</b><br>開 <span class="num">${fmt(c.o)}</span>　高 <span class="num up">${fmt(c.h)}</span><br>低 <span class="num down">${fmt(c.l)}</span>　收 <span class="num">${fmt(c.c)}</span><br>量 <span class="num">${fmt(c.v)}</span>（${c.n} 筆）`;

function spreadRows(){
  const out=[];
  allCons().forEach(id=>{
    const q=mainQ(id);const e=(S.hist[id]?.e||[]).filter(x=>x.hq===q);const per={};
    e.forEach(x=>(per[x.w]=per[x.w]||[]).push(x));
    const dcMed=wmedian(e);if(!dcMed)return;
    // 排除亂掛價：各服 7 日股價須落在 DC 股價的 1/4～4 倍內
    const ps=Object.entries(per).filter(([w,a])=>a.length>=5).map(([w,a])=>({w:+w,p:wmedian(a)})).filter(x=>x.p>=dcMed/4&&x.p<=dcMed*4);
    if(ps.length<2)return;ps.sort((a,b)=>a.p-b.p);const lo=ps[0],hi=ps[ps.length-1];
    out.push({id,lo,hi,sp:(hi.p/lo.p-1)*100});
  });
  return out.sort((a,b)=>b.sp-a.sp).slice(0,10);
}

    <td class="num">${fmt(r.lo.p)} <span class="muted">${WN[r.lo.w]}</span></td><td class="num">${fmt(r.hi.p)} <span class="muted">${WN[r.hi.w]}</span></td><td class="num up">${fmt(r.sp,1)}%</td></tr>`).join('')||'<tr><td colspan=4 class="empty">暫無資料</td></tr>'}</table></div>`}
  $('#view').innerHTML=`<h1>看盤首頁 <span class="muted" style="font-size:13px;font-weight:400">${scopeName()}・今日（近 24 小時）對比前 7 日</span></h1>

function worldAgg(world){let vol=0,amt=0,pamt=0;const buyers=new Set();

  return {vol,amt,pamt,buyers:buyers.size}}
function serverMini(){
  const rows=WORLDS.map(([id,n])=>({id,n,a:worldAgg(id)}));const mx=Math.max(1,...rows.map(r=>r.a.amt));

}

    [cur]=await Promise.all([
      getJSON(`${API}/v2/${enc(DC)}/${id}?listings=100&entries=20`,{persist:false}),
      loadHist([id],{within:30*DAY,store:S.hist30,size:1}),
      loadHist([id]),
    ]);
  }catch(e){if(tok===TOKEN)$('#view').innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`;return}
  if(tok!==TOKEN)return;
  const q=mainQ(id);const w=S.scope;
  const e30=Object.assign(S.hist30[id]?.e||[],{_cap:(S.hist30[id]?.raw||0)>=999});
  const s=statsOf(e30,q,w);
  const esScope=e30.filter(x=>x.hq===q&&(!w||x.w===w));
  const now=nowS();
  const e7=esScope.filter(x=>x.t>=now-7*DAY);
  const span=esScope.length?(now-Math.min(...esScope.map(x=>x.t)))/DAY:0;
  const capped=(S.hist30[id]?.raw||0)>=999;const removed=S.hist30[id]?.removed||0;
  const refP=s.pP??s.pT;
  const listings=(cur?.listings||[]).filter(l=>l.hq===q&&!CLOSED.has(l.worldID)&&(refP==null||l.pricePerUnit<=refP*EXT));
  const lsScope=listings.filter(l=>!w||l.worldID===w);

  const askMap={};lsScope.forEach(l=>askMap[l.pricePerUnit]=(askMap[l.pricePerUnit]||0)+l.quantity);

  const bidMap={};s.today.forEach(x=>bidMap[x.p]=(bidMap[x.p]||0)+x.q);

  const askRows=[...asks].reverse().map((r,i)=>bookRow(r,'a')).join('')||'<tr><td colspan=3 class="empty">目前沒有上架</td></tr>';
  const bidRows=bids.map(r=>bookRow(r,'b')).join('')||'<tr><td colspan=3 class="empty">近 24 小時沒有成交</td></tr>';
  // 主力買家
  const bm={};let btot=0;e7.forEach(x=>{if(!x.b)return;bm[x.b]=(bm[x.b]||0)+x.q;btot+=x.q});

    return {wid,wn,min:ls.length?Math.min(...ls.map(l=>l.pricePerUnit)):null,lq:ls.reduce((a,l)=>a+l.quantity,0),p7:wmedian(es),dv:es.reduce((a,x)=>a+x.q,0)/7}});

      <div class="muted">${sec}・${esc(CATS[it.cat]||'')}・#${id}・${scopeName()}</div></div>
    <div class="meta" style="margin-left:24px"><span class="p num ${cls(s.chg)}">${fmt(s.price)}</span><span>${pct(s.chg)} <span class="muted">vs 前 7 日（${fmt(s.pP)}）</span></span></div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      ${it.canHq?`<div class="seg"><button data-q="0" class="${!q?'on':''}">NQ</button><button data-q="1" class="${q?'on':''}">HQ</button></div>`:''}
      <button class="btn" data-star="${id}">${S.watch.includes(id)?'★ 已加入自選':'☆ 加入自選'}</button>
      <button class="btn primary" data-log="${id}">記一筆</button>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 330px;margin-bottom:14px">

const WALL_COLORS=['#f0b429','#22d3ee','#e879f9','#a3e635','#fb923c','#a78bfa','#f1f5f9','#f472b6','#60a5fa','#2dd4bf'];
const WALL_MAX=10;
const WALL_RANGES={day:{label:'24 小時',step:3600,n:24,fmt:t=>tstr(t,false)},week:{label:'7 日',step:6*3600,n:28,fmt:t=>tstr(t)},month:{label:'30 日',step:DAY,n:30,fmt:t=>{const d=new Date(t*1000);return `${d.getMonth()+1}/${d.getDate()}`}}};
S.wall=lsGet('aex_wall',null)||['s:all',...SECTORS.map(s=>'s:'+s.key)];
S.wallRange=lsGet('aex_wallrange','week');
S.wallLast=S.wallLast||{};
function saveWall(){lsSet('aex_wall',S.wall)}
function wallLabel(tok){const [k,v]=tok.split(':');if(k==='s')return v==='all'?'大盤指數':SEC[v].name+'指數';return ITEM[+v]?.n||v}
function bucketSeries(es,start,step,n){
  const out=new Array(n).fill(null),vol=new Array(n).fill(0);const bk=Array.from({length:n},()=>[]);
  es.forEach(x=>{const i=Math.floor((x.t-start)/step);if(i>=0&&i<n){bk[i].push(x);vol[i]+=x.q}});
  let last=null;for(let i=0;i<n;i++){const m=wmedian(bk[i]);if(m!=null)last=m;out[i]=last}
  const fi=out.findIndex(v=>v!=null);if(fi<0)return null;
  return {p:out,vol,fi};
}
function wallSeries(tok,rg){
  const R=WALL_RANGES[rg];const end=Math.ceil(nowS()/R.step)*R.step;const start=end-R.n*R.step;
  const [k,v]=tok.split(':');
  if(k==='i'){
    const id=+v;const h=(rg==='month'?S.hist30:S.hist)[id];if(!h)return null;
    const q=mainQ(id);const es=h.e.filter(x=>x.hq===q&&(!S.scope||x.w===S.scope));
    const s=bucketSeries(es,start,R.step,R.n);if(!s)return null;
    return {...s,start,abs:true};
  }
  if(rg==='month')return null; // 類股指數只有 8 天資料
  const ids=v==='all'?allCons():S.cons.sectors[v];
  let num=new Array(R.n).fill(0),den=0;const vol=new Array(R.n).fill(0);
  ids.forEach(id=>{const st=stats(id);if(!(st.dAmt>0))return;const s=bucketSeries(st.es,start,R.step,R.n);if(!s)return;
    const p=s.p.map(v=>v??s.p[s.fi]);for(let i=0;i<R.n;i++){num[i]+=st.dAmt*p[i]/p[0];vol[i]+=s.vol[i]*p[i]}den+=st.dAmt});
  if(!den)return null;
  return {p:num.map(x=>1000*x/den),vol,start,abs:false,fi:0};
}
function drawCompare(cv,lines,labels,hover){
  const {g,W,H}=setupCanvas(cv);g.clearRect(0,0,W,H);
  const MU=CSSV('--muted');g.font='11px '+CSSV('--mono');
  const valid=lines.filter(l=>l.pct);
  if(!valid.length){g.fillStyle=MU;g.fillText('沒有可比較的資料',W/2-50,H/2);return null}
  const padL=10,padR=64,padT=14,padB=24;const n=labels.length;
  const allv=valid.flatMap(l=>l.pct).filter(v=>v!=null);let mn=Math.min(0,...allv),mx=Math.max(0,...allv);const r=(mx-mn)||1;mn-=r*.08;mx+=r*.08;
  const X=i=>padL+i/(n-1)*(W-padL-padR),Y=v=>padT+(mx-v)/(mx-mn)*(H-padT-padB);
  // 網格
  g.strokeStyle='#18202c';g.fillStyle=MU;
  for(let i=0;i<=6;i++){const v=mn+(mx-mn)*i/6;g.beginPath();g.moveTo(padL,Y(v));g.lineTo(W-padR,Y(v));g.stroke();g.fillText((v>0?'+':'')+v.toFixed(1)+'%',W-padR+6,Y(v)+4)}
  const every=Math.ceil(n/8);for(let i=0;i<n;i+=every){g.beginPath();g.moveTo(X(i),padT);g.lineTo(X(i),H-padB);g.stroke();g.fillText(labels[i],Math.max(padL,X(i)-14),H-6)}
  g.setLineDash([5,4]);g.strokeStyle='#6b7280';g.beginPath();g.moveTo(padL,Y(0));g.lineTo(W-padR,Y(0));g.stroke();g.setLineDash([]);
  valid.forEach(l=>{
    g.strokeStyle=l.color;g.lineWidth=l.focus?2.6:1.6;g.globalAlpha=l.dim?.25:1;g.beginPath();
    let st=false;l.pct.forEach((v,i)=>{if(v==null)return;st?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));st=true});g.stroke();
    // 末端標籤
    const lv=l.pct[n-1];g.fillStyle=l.color;g.beginPath();g.arc(X(n-1),Y(lv),3,0,7);g.fill();
    g.globalAlpha=1;g.lineWidth=1;
  });
  if(hover!=null){g.strokeStyle='#9aa3b2';g.setLineDash([3,3]);g.beginPath();g.moveTo(X(hover)+.5,padT);g.lineTo(X(hover)+.5,H-padB);g.stroke();g.setLineDash([]);
    valid.forEach(l=>{if(l.pct[hover]==null)return;g.fillStyle=l.color;g.beginPath();g.arc(X(hover),Y(l.pct[hover]),3.5,0,7);g.fill()})}
  return {padL,padR,W,n};
}
function miniSvg(p0,vol,w=240,h=64,fi=0){
  const p=p0.map(v=>v??p0[fi]);const pv=p0.slice(fi);const mn=Math.min(...pv),mx=Math.max(...pv),r=(mx-mn)||1;const vh=14,ph=h-vh-2;
  const X=i=>(i/(p.length-1)*w).toFixed(1),Y=v=>(2+(mx-v)/r*(ph-4)).toFixed(1);
  const up=p[p.length-1]>=p[fi];const c=up?'var(--up)':'var(--down)';const gid='g'+Math.random().toString(36).slice(2,8);
  const line=p.map((v,i)=>i<fi?'':`${i>fi?'L':'M'}${X(i)},${Y(v)}`).join('');
  const vm=Math.max(1,...vol);const bw=Math.max(1,w/p.length-1);
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;height:${h}px">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#ff4d55':'#22c07a'}" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
     <path d="${line}L${w},${ph}L${X(fi)},${ph}Z" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    ${vol.map((v,i)=>v?`<rect x="${(i/p.length*w).toFixed(1)}" y="${(h-v/vm*vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(v/vm*vh).toFixed(1)}" fill="#3b4558"/>`:'').join('')}</svg>`;
}

function calcBook(recs){
  const pos={};let realized=0,totalBuy=0,unmatched=0;
  [...recs].sort((a,b)=>a.time-b.time).forEach(r=>{
    const k=r.itemId+'|'+(r.hq?1:0);const p=pos[k]=pos[k]||{itemId:r.itemId,hq:!!r.hq,qty:0,cost:0,realized:0,buyCost:0};
    if(r.side==='buy'){const c=r.price*r.qty*(1+(r.tax||0)/100);p.qty+=r.qty;p.cost+=c;p.buyCost+=c;totalBuy+=c}
    else{const avg=p.qty>0?p.cost/p.qty:0;const mq=Math.min(r.qty,p.qty);const rz=(r.price-avg)*mq;p.realized+=rz;realized+=rz;p.cost-=avg*mq;p.qty-=mq;if(r.qty>mq)unmatched++}
  });
  return {pos:Object.values(pos),realized,totalBuy,unmatched};
}

/* 掃描：同一伺服器的角色只掃一次，比對成交紀錄的 buyerName */
async function scanChars(chars){
  const byWorld={};chars.forEach(c=>(byWorld[c.world]=byWorld[c.world]||[]).push(c));
  const ids=ITEMS.map(it=>it.id);const cs=chunk(ids,100);
  const worlds=Object.keys(byWorld);let wi=0;
  for(const w of worlds){
    wi++;const list=byWorld[w];const names=new Map(list.map(c=>[c.name.trim().toLowerCase(),c]));
    const found={};list.forEach(c=>found[c.id]=[]);let done=0;
    showOverlay(`掃描 ${WN[w]} 的成交紀錄${worlds.length>1?`（${wi}/${worlds.length}）`:''}`,`比對角色：${list.map(c=>c.name).join('、')}・近 7 天・全部可交易物品`);
    await Promise.all(cs.map(async c=>{
      try{
        const d=await getJSON(`${API}/v2/history/${w}/${c.join(',')}?entriesToReturn=999&entriesWithin=${7*DAY}`,{persist:false,ttl:0});
        Object.values(itemsOf(d)).forEach(it=>(it.entries||[]).forEach(x=>{
          const ch=names.get((x.buyerName||'').trim().toLowerCase());
          if(ch)found[ch.id].push({itemId:it.itemID,t:x.timestamp,p:x.pricePerUnit,q:x.quantity,hq:!!x.hq,world:+w});
        }));
      }catch(e){console.warn('scan char',e)}
      done++;setProgress(done/cs.length,`${done} / ${cs.length} 批`);
    }));
    list.forEach(c=>{S.detect[c.id]={t:Date.now(),found:found[c.id].sort((a,b)=>b.t-a.t)}});
  }
  lsSet('aex_detect',S.detect);hideOverlay();
}

function detectedRows(){
  const chars=S.jview==='all'?S.chars:S.chars.filter(c=>c.id===S.jview);
  const have=new Set(S.journal.map(r=>r.src).filter(Boolean));
  const rows=[];chars.forEach(c=>(S.detect[c.id]?.found||[]).forEach(x=>rows.push({c,x,k:tradeKey(x),added:have.has(tradeKey(x)),ign:S.ignored.has(tradeKey(x))})));
  return {chars,rows:rows.sort((a,b)=>b.x.t-a.x.t)};
}

  if(t.closest('[data-detall]')){S.showDetAll=!S.showDetAll;route();return}
  if(el=t.closest('[data-detimport]')){
    const v=el.dataset.detimport;
    if(v==='all'){const {rows}=detectedRows();const p=rows.filter(r=>!r.added&&!r.ign);p.forEach(r=>importTrade(r.c.id,r.x));toast(`已加入 ${p.length} 筆`)}
    else{const [cid,k]=v.split('::');const x=(S.detect[cid]?.found||[]).find(f=>tradeKey(f)===k);if(x){importTrade(cid,x);toast('已加入紀錄')}}
    saveJournal();route();return}
  if(el=t.closest('[data-detign]')){S.ignored.add(el.dataset.detign);lsSet('aex_ignored',[...S.ignored]);route();return}
  if(el=t.closest('[data-detunign]')){S.ignored.delete(el.dataset.detunign);lsSet('aex_ignored',[...S.ignored]);route();return}
});

/* ========== 搜尋 ========== */
function isSubseq(s,q){let i=0;for(const c of s){if(c===q[i])i++;if(i===q.length)return true}return false}
function searchItems(q,limit=20){
  q=q.trim();if(!q)return [];
  if(/^\d+$/.test(q)&&ITEM[+q])return [ITEM[+q]];
  const terms=q.split(/\s+/);const res=[];
  for(const it of ITEMS){const n=it.n;let s;
    if(n===q)s=0;else if(n.startsWith(q))s=1;else if(n.includes(q))s=2;
    else if(terms.length>1&&terms.every(t=>n.includes(t)))s=3;
    else if(q.length>=2&&isSubseq(n,q.replace(/\s/g,'')))s=4;else continue;
    res.push([s+(allCons().includes(it.id)?-0.5:0),n.length,it]);
  }
  return res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,limit).map(r=>r[2]);
}
function bindSearch(inp,dd,onPick){
  let list=[],sel=0;
  const draw=()=>{dd.innerHTML=list.map((it,i)=>`<div class="opt ${i===sel?'on':''}" data-i="${i}">${ico(it)}<span>${esc(it.n)}</span><span class="cat">${it.sec?SEC[it.sec].name+'・':''}${esc(CATS[it.cat]||'')}</span></div>`).join('')||'<div class="opt muted">找不到符合的物品</div>';dd.style.display='block'};
  inp.oninput=()=>{list=searchItems(inp.value);sel=0;inp.value.trim()?draw():dd.style.display='none'};
  inp.onkeydown=ev=>{if(dd.style.display!=='block')return;
    if(ev.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();ev.preventDefault()}
    else if(ev.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();ev.preventDefault()}
    else if(ev.key==='Enter'&&list[sel]){onPick(list[sel]);dd.style.display='none';ev.preventDefault()}
    else if(ev.key==='Escape')dd.style.display='none'};
  dd.onmousedown=ev=>{const o=ev.target.closest('.opt');if(o&&o.dataset.i!=null){onPick(list[+o.dataset.i]);dd.style.display='none';ev.preventDefault()}};
  inp.onblur=()=>setTimeout(()=>dd.style.display='none',150);
}

/* ========== 跑馬燈 ========== */
async function loadTicker(){
  try{
    const sp=S.scope?`world=${S.scope}`:`dcName=${enc(DC)}`;
    const rec=await getJSON(`${API}/v2/extra/stats/most-recently-updated?${sp}&entries=50`);
    const ids=[...new Set((rec?.items||[]).map(x=>x.itemID).filter(id=>ITEM[id]))].slice(0,50);
    if(!ids.length)return;
    const scope=S.scope?S.scope:enc(DC);
    const d=await getJSON(`${API}/v2/${scope}/${ids.join(',')}?listings=0&entries=5`,{persist:false});
    const its=itemsOf(d);const all=[];
    Object.values(its).forEach(it=>(it.recentHistory||[]).filter(h=>!CLOSED.has(h.worldID)&&!(it.averagePrice&&(h.pricePerUnit>it.averagePrice*EXT||h.pricePerUnit<it.averagePrice/EXT))).forEach(h=>all.push({id:it.itemID,p:h.pricePerUnit,q:h.quantity,hq:h.hq,t:h.timestamp,w:h.worldName,avg:it.averagePrice})));
    all.sort((a,b)=>b.t-a.t);
    const html=all.slice(0,40).map(x=>{const c=x.avg?cls(x.p/x.avg-1):'flat';return `<span class="t" data-go="#/item/${x.id}"><b>${esc(ITEM[x.id]?.n)}</b>${x.hq?'<span class="hq">HQ</span>':''}<span class="num ${c}">${fmt(x.p)}</span><span class="muted num">×${fmt(x.q)}</span><span class="muted">${esc(x.w||WN[S.scope]||'')}・${tstr(x.t,false)}</span></span>`}).join('');
    $('#track').innerHTML=html;
  }catch(e){console.warn('ticker',e)}
}

/* ========== 路由與事件 ========== */
let TOKEN=0;
async function route(){
  const tok=++TOKEN;renderShell();
  const h=location.hash||'#/';const [,p,arg]=h.split('/');
  try{
    if(!p)renderHome();
    else if(p==='sector')renderSector(arg&&SEC[arg]?arg:null);
    else if(p==='item')await renderItem(+arg,tok);
    else if(p==='servers')renderServers();
    else if(p==='wall')await renderWall(tok);
    else if(p==='watch')await renderWatch(tok);
    else if(p==='journal')await renderJournal(tok);
    else renderHome();
  }catch(e){console.error(e);$('#view').innerHTML=`<div class="empty">發生錯誤：${esc(e.message)}</div>`}
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const s=t.closest('[data-star]');if(s){ev.stopPropagation();const id=+s.dataset.star;const i=S.watch.indexOf(id);i>=0?S.watch.splice(i,1):S.watch.push(id);lsSet('aex_watch',S.watch);
    if(s.classList.contains('star'))s.classList.toggle('on');else route();toast(i>=0?'已移出自選股':'已加入自選股');return}
  const lg=t.closest('[data-log]');if(lg){openLog(lg.dataset.log?+lg.dataset.log:null);return}
  const ed=t.closest('[data-edit]');if(ed){openLog(null,ed.dataset.edit);return}
  const dl=t.closest('[data-del]');if(dl){if(confirm('確定刪除這筆紀錄？')){S.journal=S.journal.filter(x=>x.id!==dl.dataset.del);saveJournal();route()}return}
  const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort;if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=k==='name'?1:-1}route();return}
  const md=t.closest('[data-mode]');if(md){ITEMV.mode=md.dataset.mode;route();return}
  const qb=t.closest('[data-q]');if(qb){const id=+location.hash.split('/')[2];S.qual[id]=qb.dataset.q==='1';lsSet('aex_qual',S.qual);S.memo.clear();route();return}
  const wr=t.closest('[data-world]');if(wr&&wr.classList.contains('row')){setScope(+wr.dataset.world);if(location.hash.startsWith('#/servers'))location.hash='#/';return}
  const go=t.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
});
$('#modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal')closeModal()});
function setScope(v){S.scope=v||null;lsSet('aex_scope',S.scope);S.memo.clear();loadTicker();route()}
$('#scope').onchange=ev=>setScope(+ev.target.value);
window.addEventListener('hashchange',()=>{$('#view').scrollTop=0;document.querySelector('main').scrollTop=0;route()});
let rsz;window.addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(route,200)});
bindSearch($('#q'),$('#dd'),it=>{$('#q').value='';location.hash='#/item/'+it.id});
$('#refresh').onclick=async()=>{pruneCache(true);MEM.clear();S.hist={};S.hist30={};await loadMain(true);loadTicker();loadTax();loadUpload().then(()=>location.hash.startsWith('#/servers')&&route());route()};

/* ========== 啟動 ========== */
(async function init(){
  pruneCache();
  renderShell();
  S.cons=lsGet('aex_cons',null);
  if(!S.cons||Date.now()-S.cons.t>24*3600*1000||!S.cons.sectors)await scanConstituents();
  await loadMain(true);
  route();
  loadTicker();
  Promise.all([loadTax(),loadUpload()]).then(()=>{if(location.hash.startsWith('#/servers'))route()});
  setInterval(async()=>{await loadMain(false);loadTicker();loadUpload();if(!$('#modal').style.display.includes('grid'))route()},TTL);
})();
</script>
